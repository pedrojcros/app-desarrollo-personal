appId: host.exp.exponent
---
- tapOn: Añadir tarea o hábito
- tapOn: Hábito
- inputText: E2E hábito semanal
- tapOn: Frecuencia
- tapOn:
    text: Días de la semana
    optional: true
- runFlow:
    when:
      visible: Todos los días
    commands:
      # El selector no expone la opción con etiqueta y cambia de posición según el ancho.
      - tapOn:
          point: '26%,${FREQUENCY_OPTION_Y}'
- hideKeyboard
- assertVisible: Días de la semana
- tapOn: Lunes
- tapOn: Martes
- tapOn: Miércoles
- tapOn: Jueves
- tapOn: Viernes
- tapOn: Sábado
- tapOn: Domingo
- tapOn: Enviar
- hideKeyboard
- pressKey: BACK
- assertVisible: E2E hábito semanal
