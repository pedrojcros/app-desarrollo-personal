appId: host.exp.exponent
---
# Sigue a «login»: la sesión queda guardada en Expo Go. Los avisos de una tarea
# aparecen en la pantalla de desarrollo y desaparecen al marcarla como hecha.

# 1. Aceptar el permiso de avisos desde Ajustes.
- openLink: exp://10.0.2.2:${EXPO_PORT}/--/ajustes
- extendedWaitUntil:
    visible: Recordatorios
    timeout: 120000
- runFlow:
    when:
      visible: Permitir avisos
    commands:
      - tapOn: Permitir avisos
      - extendedWaitUntil:
          visible: Allow
          timeout: 10000
      - tapOn: Allow

# 2. Crear una tarea para mañana (los atajos de fecha no llegan a pasado mañana
#    sin el selector nativo, y mañana ya genera el aviso de las 9:00).
- openLink: exp://10.0.2.2:${EXPO_PORT}
- extendedWaitUntil:
    visible: Hoy
    timeout: 120000
- tapOn: Añadir tarea o hábito
- tapOn: 'Fecha: Mañana'
- tapOn: Nombre
- inputText: E2E recordatorio
- pressKey: ENTER
- assertVisible: E2E recordatorio

# 3. Sus avisos aparecen en la pantalla de desarrollo.
- openLink: exp://10.0.2.2:${EXPO_PORT}/--/recordatorios
- extendedWaitUntil:
    visible: Poner al día
    timeout: 120000
- tapOn: Poner al día
- extendedWaitUntil:
    visible: E2E recordatorio
    timeout: 30000

# 4. Marcar la tarea como hecha (está en el día de mañana).
- openLink: exp://10.0.2.2:${EXPO_PORT}
- extendedWaitUntil:
    visible: Hoy
    timeout: 120000
- tapOn: Día siguiente
- tapOn: Marcar E2E recordatorio como hecho
- assertVisible: Marcada como hecha

# 5. Al ponerlo al día, los avisos han desaparecido.
- openLink: exp://10.0.2.2:${EXPO_PORT}/--/recordatorios
- extendedWaitUntil:
    visible: Poner al día
    timeout: 120000
- tapOn: Poner al día
- extendedWaitUntil:
    visible: Puesto al día.
    timeout: 30000
- assertNotVisible: E2E recordatorio
