<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lista de la compra · Negro</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;650;700&display=swap" rel="stylesheet"><style>
:root{
  --background:#0E1813;--surface:#15221B;--raised:#1C2C23;--border:#27392F;--border-strong:#3A5043;
  --text:#E9F1EB;--muted:#93A89A;--accent:#E8C468;--negative:#D9776A;
  --university:#8DB8F2;--health:#7AD39A;--personal:#EFA66A;--home:#F2A7A0;
  --shopping:#5CCFC4;--inbox:#A3B1A8;--keyboard-height:270px;
}
*{box-sizing:border-box}
html{background:var(--background)}
body{margin:0;min-height:100vh;background:var(--background);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
svg{width:22px;height:22px;flex-shrink:0}
[hidden]{display:none!important}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cabecera */
.screen-header{padding:28px 20px 12px}
.eyebrow{margin:0 0 6px;font-size:12px;color:var(--muted);letter-spacing:.1px}
.title-line{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font-size:34px;line-height:1.1;letter-spacing:-1.3px;font-weight:650}
.progress{display:flex;flex-direction:column;align-items:flex-end;gap:7px;padding-bottom:4px}
.progress-text{font-size:12px;color:var(--muted)}
.progress-text strong{color:var(--accent);font-weight:650;font-size:13px}
.squares{display:flex;gap:3px}
.square{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--border-strong)}
.square.yes{background:var(--accent);border-color:var(--accent)}
.square.no{background:var(--negative);border-color:var(--negative)}
main{padding:0 20px 160px}

/* listas sin cajitas */
.section-title{display:flex;align-items:center;gap:12px;margin:18px 0 0;font-size:10.5px;font-weight:650;letter-spacing:1.7px;color:var(--muted);text-transform:uppercase}
.section-title:after{content:'';flex:1;height:1px;background:var(--border)}
.row{display:flex;align-items:center;gap:2px;min-height:64px;border-bottom:1px solid var(--border)}
.task-text{flex:1;min-width:0;padding:10px 0}
.task-name{display:block;font-size:15px;font-weight:500;line-height:20px;letter-spacing:-.15px}
.meta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;color:var(--muted)}
.meta b{font-weight:600;color:#C5D6CA}
.dot{width:6px;height:6px;border-radius:50%;background:var(--category);flex-shrink:0}
.mark{width:46px;height:46px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mark-disc{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mark-disc svg{width:17px;height:17px;stroke-width:2.4}
.mark.yes .mark-disc{background:var(--category);color:var(--background)}
.mark.no .mark-disc{border:1.5px solid rgba(217,119,106,.5);color:var(--negative)}
.mark.no svg{width:15px;height:15px}
.mark:active .mark-disc{transform:scale(.92)}

/* botón + y aviso */
.floating{position:fixed;right:20px;bottom:146px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:var(--accent);color:var(--background);box-shadow:0 8px 22px rgba(0,0,0,.4)}
.floating svg{width:26px;height:26px;stroke-width:2.4}
.toast{position:fixed;left:20px;right:20px;bottom:88px;height:50px;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;border:1px solid var(--border-strong);border-radius:14px;background:var(--raised);font-size:13px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.toast>svg{width:17px;height:17px;color:var(--health);stroke-width:2.4}
.toast button{margin-left:auto;min-height:44px;padding:0 12px;font-weight:700;font-size:13px;color:var(--accent)}

/* navegación */
.navigation{position:fixed;left:0;right:0;bottom:0;height:74px;display:flex;padding:8px 4px 8px;background:var(--surface);border-top:1px solid var(--border);z-index:3}
.navigation a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.nav-icon{position:relative;width:52px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.nav-icon svg{width:21px;height:21px}
.navigation a.active{color:var(--accent);font-weight:600}
.navigation a.active .nav-icon{background:var(--raised)}
.badge{position:absolute;top:-3px;right:7px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:var(--background);font-size:10px;font-weight:700;line-height:15px;text-align:center}

/* iconos de categoría */
.tile{width:38px;height:38px;border-radius:12px;background:var(--raised);color:var(--category);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile svg{width:20px;height:20px}
.tile.small{width:28px;height:28px;border-radius:9px}
.tile.small svg{width:16px;height:16px}

/* barra de añadir rápido */
.scrim{position:fixed;left:0;right:0;top:0;bottom:var(--keyboard-height);background:rgba(3,8,5,.55);z-index:4}
.sheet{position:fixed;left:0;right:0;top:0;bottom:var(--keyboard-height);z-index:5;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none}
.sheet>*{pointer-events:auto}
.menu-area{flex:0 1 auto;min-height:0;overflow-y:auto;padding-top:12px}
.menu-area:empty{display:none}
.menu{margin:0 12px 8px;padding:6px;border:1px solid var(--border-strong);border-radius:18px;background:#1A2A21;box-shadow:0 -10px 34px rgba(0,0,0,.5)}
.menu-title{margin:2px 10px 4px;font-size:10.5px;font-weight:650;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.menu-item{width:100%;min-height:42px;display:flex;align-items:center;gap:12px;padding:0 10px;border-radius:12px;text-align:left;font-size:14.5px}
.menu-item[aria-selected="true"]{background:var(--raised)}
.menu-label{flex:1;min-width:0}
.menu-item .check{width:18px;height:18px;color:var(--accent);opacity:0;stroke-width:2.4}
.menu-item[aria-selected="true"] .check{opacity:1}
.menu-item .caret-icon{width:17px;height:17px;color:var(--muted)}
.menu-item[aria-expanded="true"] .caret-icon{transform:rotate(180deg)}
.menu-item.plain{min-height:46px;padding-left:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px 50px;padding:2px 4px 4px 0}
.chip{height:38px;padding:0 14px;border:1px solid var(--border-strong);border-radius:19px;font-size:13px;color:var(--text)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(232,196,104,.1)}

.composer{margin:0;padding:6px 16px 8px;border-top:1px solid #3F574A;border-radius:22px 22px 0 0;background:var(--surface);box-shadow:0 -12px 30px rgba(0,0,0,.35)}
.handle{width:32px;height:3px;margin:0 auto 6px;border-radius:2px;background:#405448}
.compose-title{display:flex;align-items:center;gap:10px;height:48px}
.field{position:relative;flex:1;min-width:0;height:48px;display:flex;align-items:center;overflow:hidden}
.field.long{justify-content:flex-end}
.mirror-text{white-space:pre;font-size:23px;letter-spacing:-.5px;font-weight:500}
.mirror-text.empty{color:#6C8274}
.caret{display:inline-block;flex-shrink:0;width:2px;height:27px;margin-left:1px;border-radius:1px;background:var(--accent)}
.field input{position:absolute;inset:0;width:100%;opacity:0;font-size:23px;border:0;background:none}
.send{width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:15px;background:var(--accent);color:var(--background)}
.send svg{width:24px;height:24px;stroke-width:2.4}
.type-line{display:flex;align-items:center;justify-content:space-between;height:44px}
.segmented{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--background)}
.segmented button{height:34px;padding:0 16px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted)}
.segmented button[aria-pressed="true"]{background:var(--raised);color:var(--accent);font-weight:650}
.more{height:44px;display:flex;align-items:center;gap:5px;padding:0 4px 0 10px;font-size:13px;color:var(--muted)}
.more svg{width:18px;height:18px}
.more[aria-expanded="true"]{color:var(--accent)}
.habit-options{display:flex;gap:8px;height:44px;align-items:center}
.select-trigger{flex:1;min-width:0;height:38px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 12px;border:1px solid var(--border-strong);border-radius:11px;background:var(--raised);font-size:13px}
.select-trigger svg{width:16px;height:16px;color:var(--muted)}
.select-trigger[aria-expanded="true"]{border-color:var(--accent)}
.date-line{display:flex;align-items:center;height:44px;gap:2px}
.start-label{padding:0 6px 0 2px;font-size:12px;color:var(--muted)}
.date-chip{height:36px;padding:0 11px;border-radius:10px;font-size:13px;color:var(--muted);white-space:nowrap}
.date-chip[aria-pressed="true"]{background:var(--raised);color:var(--accent);font-weight:650;box-shadow:inset 0 0 0 1px var(--border-strong)}
.date-chip.calendar{width:42px;padding:0;display:flex;align-items:center;justify-content:center}
.date-chip.calendar svg{width:18px;height:18px}
.extra{display:flex;gap:8px;margin-bottom:6px}
.extra input{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid var(--border-strong);border-radius:11px;background:var(--raised);color:var(--text);color-scheme:dark;font-size:14px}
.category-trigger{width:100%;height:46px;display:flex;align-items:center;gap:10px;margin-top:2px;padding:0 4px 0 0;border-top:1px solid var(--border);font-size:13.5px}
.category-trigger .category-label{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.category-trigger>svg:last-child{width:18px;height:18px;color:var(--muted)}
.category-trigger[aria-expanded="true"]>svg:last-child{transform:rotate(180deg);color:var(--accent)}
.category-trigger[aria-expanded="true"]{color:var(--text)}

/* teclado de Android (maqueta) */
.keyboard{position:fixed;left:0;right:0;bottom:0;height:var(--keyboard-height);z-index:6;padding:0 4px;background:#1B211E}
.suggestions{height:40px;display:flex;align-items:center;justify-content:space-evenly;font-size:15px;color:#D9E2DC}
.suggestions span+span{padding-left:26px;border-left:1px solid #3E4942}
.key-row{display:flex;justify-content:center;gap:4px;margin-bottom:5px}
.key-row button{flex:1;height:42px;border-radius:6px;background:#2E3832;font-size:18px;color:#E9F1EB;box-shadow:0 1px 0 rgba(0,0,0,.45)}
.key-row.third button.wide{flex:1.45;background:#252E29}
.key-row.bottom button{font-size:13px;background:#252E29}
.key-row.bottom .space{flex:4.4;background:#2E3832;font-size:12px;color:#B6C4BA}
.key-row.bottom .enter{flex:1.3;background:#5C7A64;color:#0E1813}
.key-row svg{width:20px;height:20px}
.keyboard-footer{display:flex;align-items:center;justify-content:space-between;height:26px;padding:0 20px;color:#8FA196}
.keyboard-footer svg{width:17px;height:17px}
.home-bar{position:absolute;left:50%;bottom:6px;width:104px;height:4px;margin-left:-52px;border-radius:2px;background:#CCD5CF}

@media(min-width:400px){.screen-header{padding-top:34px}.row{min-height:70px}.task-name{font-size:16px}.meta{font-size:12px}}
@media(prefers-reduced-motion:no-preference){.caret{animation:blink 1.05s step-end infinite}@keyframes blink{50%{opacity:0}}}

.screen-header{padding-top:18px}
.top-line{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-top:-6px}
.back{display:flex;align-items:center;gap:2px;height:44px;margin-left:-6px;padding-right:12px;font-size:13px;color:var(--muted)}
.back svg{width:18px;height:18px}
.pending-count{font-size:12px;color:var(--muted)}
.pending-count strong{color:var(--accent);font-weight:650;font-size:13px}
.category-title{display:flex;align-items:center;gap:12px;margin-top:4px}
.category-title .tile{width:46px;height:46px;border-radius:14px}
.category-title .tile svg{width:24px;height:24px}
h1{font-size:30px;letter-spacing:-1.1px}
main{padding-bottom:520px}
.section-title .section-count{order:3;font-size:11px;letter-spacing:0;color:var(--muted);font-weight:500}

utton" class="mark yes" aria-label="Marcar Huevos como hecho"><span class="mark-disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button><button type="button" class="mark no" aria-label="Marcar Huevos como no hecho"><span class="mark-disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span></button></div><div class="row" style="--category:var(--shopping)"><div class="task-text"><span class="task-name">Pan integral</span><span class="meta"><i class="dot"></i><span>Sin fecha · Tarea</span></span></div><button type="button" class="mark yes" aria-label="Marcar Pan integral como hecho"><span class="mark-disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button><button type="button" class="mark no" aria-label="Marcar Pan integral como no hecho"><span class="mark-disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span></button></div></section><section data-section="Lidl"><h2 class="section-title">Lidl</h2><div class="row" style="--category:var(--shopping)"><div class="task-text"><span class="task-name">Papel de cocina</span><span class="meta"><i class="dot"></i><span>Sin fecha · Tarea</span></span></div><button type="button" class="mark yes" aria-label="Marcar Papel de cocina como hecho"><span class="mark-disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button><button t hevron-down": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"/></svg>", "chevron-up": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m18 15-6-6-6 6\"/></svg>", "chevron-right": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 18 6-6-6-6\"/></svg>", "chevron-left": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 18-6-6 6-6\"/></svg>", "arrow-up": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 7-7 7 7\"/><path d=\"M12 19V5\"/></svg>", "calendar": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 2v4\"/><path d=\"M16 2v4\"/><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M3 10h18\"/></svg>", "ellipsis": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"1\"/><circle cx=\"19\" cy=\"12\" r=\"1\"/><circle cx=\"5\" cy=\"12\" r=\"1\"/></svg>", "folder": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z\"/></svg>", "delete": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z\"/><path d=\"m18 9-6 6\"/><path d=\"m12 9 6 6\"/></svg>", "keyboard": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10 8h.01\"/><path d=\"M12 12h.01\"/><path d=\"M14 8h.01\"/><path d=\"M16 12h.01\"/><path d=\"M18 8h.01\"/><path d=\"M6 8h.01\"/><path d=\"M7 16h10\"/><path d=\"M8 12h.01\"/><rect width=\"20\" height=\"16\" x=\"2\" y=\"4\" rx=\"2\"/></svg>", "shift": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18v-6H5l7-7 7 7h-4v6H9z\"/></svg>"};
const CATEGORIES = {"inbox": {"label": "Bandeja de entrada", "icon": "inbox", "color": "var(--inbox)", "sections": []}, "shopping": {"label": "Lista de la compra", "icon": "basket", "color": "var(--shopping)", "sections": ["Mercadona", "Lidl"]}, "university": {"label": "Universidad", "icon": "cap", "color": "var(--university)", "sections": ["Redes", "Bases de datos"]}, "health": {"label": "Salud", "icon": "heart", "color": "var(--health)", "sections": []}, "personal": {"label": "Personal", "icon": "user", "color": "var(--personal)", "sections": []}, "home": {"label": "Casa", "icon": "house", "color": "var(--home)", "sections": []}};

// Crea una fila de tarea igual que las del HTML estático
function createTaskRow(title, colorVariable, metaText, time) {
  const row = document.createElement('div');
  row.className = 'row';
  row.style.setProperty('--category', colorVariable);
  const text = document.createElement('div');
  text.className = 'task-text';
  const name = document.createElement('span');
  name.className = 'task-name';
  name.textContent = title;
  const meta = document.createElement('span');
  meta.className = 'meta';
  const dot = document.createElement('i');
  dot.className = 'dot';
  const metaLabel = document.createElement('span');
  if (time) {
    const timeLabel = document.createElement('b');
    timeLabel.textContent = time;
    metaLabel.append(timeLabel, ' · ');
  }
  metaLabel.append(metaText);
  meta.append(dot, metaLabel);
  text.append(name, meta);
  row.append(text);
  for (const outcome of ['yes', 'no']) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'mark ' + outcome;
    button.setAttribute('aria-label', 'Marcar ' + title + (outcome === 'yes' ? ' como hecho' : ' como no hecho'));
    const disc = document.createElement('span');
    disc.className = 'mark-disc';
    disc.innerHTML = outcome === 'yes' ? ICONS.check : ICONS.x;
    button.append(disc);
    row.append(button);
  }
  return row;
}


function updatePendingCount() {
  document.getElementById('pending-count').textContent = String(document.querySelectorAll('#task-list .row').length);
}

document.addEventListener('click', function(event) {
  const markButton = event.target.closest('.mark');
  if (!markButton) return;
  markButton.closest('.row').remove();
  updatePendingCount();
});

// Al enviar, la tarea entra en su sección; si es de otra categoría, solo se confirma en la barra
window.onTaskAdded = function(task) {
  if (task.category !== 'shopping') return;
  const sectionName = task.section || 'Sin sección';
  const section = document.querySelector('[data-section="' + sectionName + '"]');
  const metaText = task.date + ' · ' + task.kindLabel;
  const row = createTaskRow(task.title, CATEGORIES.shopping.color, metaText, null);
  section.append(row);
  updatePendingCount();
};


// Barra de añadir rápido: los menús se abren siempre hacia arriba, sobre la barra
const composerState = {mode: 'task', date: 'Sin fecha', category: 'shopping', section: "Mercadona", frequency: 'A diario', moment: 'Mañana'};
const composerForm = document.getElementById('composer');
const nameInput = document.getElementById('task-name');
const mirrorText = document.getElementById('mirror-text');
const field = document.getElementById('field');
const scrim = document.getElementById('scrim');
const menuTriggers = {
  category: document.getElementById('category-trigger'),
  frequency: document.getElementById('frequency-trigger'),
  when: document.getElementById('when-trigger'),
};
let placeholderText = 'Añadir otra…';
let openMenuName = null;

function renderField() {
  const value = nameInput.value;
  const isEmpty = value.length === 0;
  mirrorText.textContent = isEmpty ? placeholderText : value;
  mirrorText.classList.toggle('empty', isEmpty);
  field.classList.toggle('long', field.scrollWidth > field.clientWidth);
}

function typeIntoName(newValue) {
  nameInput.value = newValue;
  renderField();
}

function closeMenus() {
  openMenuName = null;
  scrim.hidden = true;
  for (const menu of document.querySelectorAll('.menu')) menu.hidden = true;
  for (const trigger of Object.values(menuTriggers)) trigger.setAttribute('aria-expanded', 'false');
}

function toggleMenu(menuName) {
  const wasOpen = openMenuName === menuName;
  closeMenus();
  if (wasOpen) return;
  openMenuName = menuName;
  scrim.hidden = false;
  document.getElementById('menu-' + menuName).hidden = false;
  menuTriggers[menuName].setAttribute('aria-expanded', 'true');
}

function categoryLabel() {
  const category = CATEGORIES[composerState.category];
  if (!composerState.section) return category.label;
  return category.label + ' › ' + composerState.section;
}

function renderCategory() {
  const category = CATEGORIES[composerState.category];
  const tile = document.getElementById('category-tile');
  tile.style.setProperty('--category', category.color);
  tile.innerHTML = ICONS[category.icon];
  document.getElementById('category-label').textContent = categoryLabel();
  for (const item of document.querySelectorAll('[data-category]')) {
    item.setAttribute('aria-selected', String(item.dataset.category === composerState.category));
  }
  for (const chip of document.querySelectorAll('.chip')) {
    const chipsOwner = chip.parentElement.dataset.chips;
    const chipSection = chip.dataset.section === 'Sin sección' ? null : chip.dataset.section;
    const isSelected = chipsOwner === composerState.category
      && chipSection === composerState.section
      && composerState.sectionChosen;
    chip.setAttribute('aria-pressed', String(isSelected));
  }
}

function expandCategory(categoryId) {
  for (const chips of document.querySelectorAll('.chips')) {
    const shouldShow = chips.dataset.chips === categoryId && chips.hidden;
    chips.hidden = !shouldShow;
    const item = document.querySelector('[data-category="' + chips.dataset.chips + '"]');
    item.setAttribute('aria-expanded', String(shouldShow));
  }
}

for (const trigger of Object.values(menuTriggers)) {
  trigger.addEventListener('click', function() { toggleMenu(trigger.dataset.menu); });
}
scrim.addEventListener('click', closeMenus);

for (const item of document.querySelectorAll('[data-category]')) {
  item.addEventListener('click', function() {
    const category = CATEGORIES[item.dataset.category];
    if (category.sections.length > 0) {
      expandCategory(item.dataset.category);
      return;
    }
    composerState.category = item.dataset.category;
    composerState.section = null;
    composerState.sectionChosen = true;
    renderCategory();
    closeMenus();
  });
}

for (const chip of document.querySelectorAll('.chip')) {
  chip.addEventListener('click', function() {
    composerState.category = chip.parentElement.dataset.chips;
    composerState.section = chip.dataset.section === 'Sin sección' ? null : chip.dataset.section;
    composerState.sectionChosen = true;
    renderCategory();
    closeMenus();
  });
}

function bindSimpleMenu(menuName, stateKey, labelId) {
  const menu = document.getElementById('menu-' + menuName);
  function markSelected() {
    for (const item of menu.querySelectorAll('[data-value]')) {
      item.setAttribute('aria-selected', String(item.dataset.value === composerState[stateKey]));
    }
  }
  for (const item of menu.querySelectorAll('[data-value]')) {
    item.addEventListener('click', function() {
      composerState[stateKey] = item.dataset.value;
      document.getElementById(labelId).textContent = item.dataset.value;
      markSelected();
      closeMenus();
      if (item.dataset.value === 'A una hora') {
        document.getElementById('more-extra').hidden = false;
        document.getElementById('more').setAttribute('aria-expanded', 'true');
        document.getElementById('exact-time').focus();
      }
    });
  }
  markSelected();
}
bindSimpleMenu('frequency', 'frequency', 'frequency-label');
bindSimpleMenu('when', 'moment', 'when-label');

function selectDate(dateName) {
  composerState.date = dateName;
  for (const chip of document.querySelectorAll('[data-date]')) {
    chip.setAttribute('aria-pressed', String(chip.dataset.date === dateName));
  }
  document.getElementById('calendar').setAttribute('aria-pressed', 'false');
}

for (const chip of document.querySelectorAll('[data-date]')) {
  chip.addEventListener('click', function() { selectDate(chip.dataset.date); });
}

document.getElementById('calendar').addEventListener('click', function(event) {
  const extra = document.getElementById('date-extra');
  extra.hidden = !extra.hidden;
  event.currentTarget.setAttribute('aria-pressed', String(!extra.hidden));
});

document.getElementById('custom-date').addEventListener('change', function(event) {
  composerState.date = event.target.value;
  for (const chip of document.querySelectorAll('[data-date]')) chip.setAttribute('aria-pressed', 'false');
  document.getElementById('calendar').setAttribute('aria-pressed', 'true');
});

document.getElementById('more').addEventListener('click', function(event) {
  const extra = document.getElementById('more-extra');
  extra.hidden = !extra.hidden;
  event.currentTarget.setAttribute('aria-expanded', String(!extra.hidden));
});

for (const modeButton of document.querySelectorAll('[data-mode]')) {
  modeButton.addEventListener('click', function() {
    composerState.mode = modeButton.dataset.mode;
    const isHabit = composerState.mode === 'habit';
    for (const other of document.querySelectorAll('[data-mode]')) {
      other.setAttribute('aria-pressed', String(other === modeButton));
    }
    closeMenus();
    document.getElementById('habit-options').hidden = !isHabit;
    document.getElementById('start-label').hidden = !isHabit;
    document.querySelector('[data-date="Sin fecha"]').hidden = isHabit;
    if (isHabit && composerState.date === 'Sin fecha') selectDate('Hoy');
  });
}

nameInput.addEventListener('input', renderField);

composerForm.addEventListener('submit', function(event) {
  event.preventDefault();
  const title = nameInput.value.trim();
  if (title === '') {
    nameInput.focus();
    return;
  }
  const category = CATEGORIES[composerState.category];
  const kind = composerState.mode === 'task' ? 'Tarea' : 'Hábito';
  const task = {title: title, category: composerState.category, section: composerState.section, date: composerState.date, kindLabel: kind};
  closeMenus();
  window.onTaskAdded(task);
  placeholderText = 'Añadida a ' + category.label + '. ¿Otra?';
  typeIntoName('');
  nameInput.focus({preventScroll: true});
});

// Teclado de maqueta: escribe en el mismo campo
let uppercase = false;
const keyboardKeys = document.querySelectorAll('[data-key]');
for (const key of keyboardKeys) {
  key.addEventListener('mousedown', function(event) { event.preventDefault(); });
  key.addEventListener('click', function() {
    const value = key.dataset.key;
    if (value === 'send') { composerForm.requestSubmit(); return; }
    if (value === 'delete') { typeIntoName(nameInput.value.slice(0, -1)); return; }
    if (value === 'numbers') return;
    if (value === 'shift') {
      uppercase = !uppercase;
      for (const letterKey of keyboardKeys) {
        if (letterKey.dataset.key.length !== 1 || !/\p{L}/u.test(letterKey.dataset.key)) continue;
        letterKey.textContent = uppercase ? letterKey.dataset.key.toUpperCase() : letterKey.dataset.key;
      }
      return;
    }
    const typed = uppercase ? value.toUpperCase() : value;
    typeIntoName(nameInput.value + typed);
    uppercase = false;
    for (const letterKey of keyboardKeys) {
      if (/\p{L}/u.test(letterKey.dataset.key) && letterKey.dataset.key.length === 1) letterKey.textContent = letterKey.dataset.key;
    }
  });
}

composerState.sectionChosen = true;
renderCategory();
renderField();
nameInput.focus({preventScroll: true});

</script></body></html>
