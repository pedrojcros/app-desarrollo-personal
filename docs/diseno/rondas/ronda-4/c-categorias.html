<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categorías · Estilo C</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme:light; --paper:#fffbeF; --surface:#fff; --soft:#f4efdf; --ink:#111; --muted:#4a4a4a; --line:#d9d2c0; --yellow:#ffe14d; --blue:#8ab4ff; --green:#6ee7a8; --orange:#ffb86b; --pink:#ff8fb1; --teal:#62d9cb; }
    * { box-sizing:border-box; }
    body { height:100vh; min-height:720px; margin:0; overflow:hidden; background:var(--paper); color:var(--ink); font-family:"Archivo",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    button { color:inherit; font:inherit; cursor:pointer; }
    .screen { height:100%; }
    .content { height:100%; overflow-y:auto; padding:20px 16px 155px; }
    h1 { margin:0; font-size:29px; line-height:1.05; font-weight:800; letter-spacing:-.045em; }
    .subtitle { margin:6px 0 15px; color:var(--muted); font-size:12px; }
    .inbox-row { display:flex; min-height:54px; align-items:center; gap:10px; padding:0 4px; border-bottom:1.5px solid var(--ink); }
    .inbox-icon { display:grid; width:29px; height:29px; place-items:center; border:1.5px solid var(--ink); background:var(--soft); }
    .inbox-icon svg { width:18px; height:18px; }
    .row-label { min-width:0; flex:1; font-size:14px; font-weight:700; }
    .count { display:grid; min-width:29px; height:27px; place-items:center; padding:0 5px; border:1.5px solid var(--ink); background:var(--surface); box-shadow:1px 1px 0 var(--ink); font-size:12px; font-weight:800; }
    .chevron { width:18px; height:18px; transition:transform .15s ease; }
    .category-list { margin-top:10px; }
    .category { margin:0; }
    .category-toggle { display:flex; width:100%; min-height:52px; align-items:center; gap:10px; padding:0 3px; border:0; border-bottom:1px solid var(--line); background:transparent; text-align:left; }
    .category-icon { display:grid; width:32px; height:32px; flex:0 0 auto; place-items:center; border:1.5px solid var(--ink); background:var(--color); box-shadow:1px 1px 0 var(--ink); }
    .category-icon svg { width:19px; height:19px; }
    .category-name { min-width:0; flex:1; font-size:14px; font-weight:700; }
    .chevron { flex:0 0 auto; }
    .category-toggle[aria-expanded="true"] .chevron { transform:rotate(90deg); }
    .sections { margin-left:17px; border-left:1.5px solid var(--ink); }
    .section-row { display:flex; min-height:38px; align-items:center; gap:8px; margin-left:11px; padding:0 8px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.55); }
    .section-name { flex:1; font-size:12px; font-weight:600; }
    .section-row .count { min-width:26px; height:24px; font-size:11px; }
    .section-row.no-section { margin-top:4px; background:transparent; }
    .actions { position:fixed; right:16px; bottom:78px; left:16px; display:flex; gap:10px; }
    .new-category { display:flex; min-height:46px; flex:1; align-items:center; justify-content:center; gap:8px; border:1.5px solid var(--ink); background:var(--yellow); box-shadow:2px 2px 0 var(--ink); font-size:12px; font-weight:800; }
    .new-category svg { width:17px; height:17px; }
    .bottom-nav { position:fixed; right:0; bottom:0; left:0; display:grid; height:64px; grid-template-columns:repeat(5,1fr); border-top:1.5px solid var(--ink); background:var(--surface); }
    .nav-link { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--muted); font-size:9px; text-decoration:none; }
    .nav-link svg { width:20px; height:20px; }
    .nav-icon { display:grid; width:35px; height:28px; place-items:center; border:1.5px solid transparent; border-radius:8px; }
    .nav-link.active { color:var(--ink); font-weight:800; }
    .nav-link.active .nav-icon { border-color:var(--ink); background:var(--yellow); box-shadow:1.5px 1.5px 0 var(--ink); }
    .nav-label { line-height:1; }
    .badge { position:absolute; margin:-25px 0 0 17px; display:grid; width:15px; height:15px; place-items:center; border:1px solid var(--ink); border-radius:50%; background:var(--orange); font-size:9px; font-weight:800; }
    @media (min-width:400px) { .content { padding-right:20px; padding-left:20px; } }
  </style>
</head>
<body>
  <div class="screen">
    <main class="content">
      <h1>Categorías</h1>
      <p class="subtitle">Lo que queda pendiente en cada una</p>
      <div class="inbox-row">
        <span class="inbox-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 6 5h12l3 5.5v7a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="M3 11h5l1.5 2h5L16 11h5"/></svg></span>
        <span class="row-label">Bandeja de entrada</span><span class="count">1</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div class="category-list">
        <section class="category">
          <button class="category-toggle" aria-expanded="true" aria-controls="shoppingSections" style="--color:var(--teal)">
            <span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18l-2 10H5z"/><path d="M8 10 12 4l4 6M7 13l3 4m7-4-3 4"/></svg></span>
            <span class="category-name">Lista de la compra</span><span class="count">5</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <div class="sections" id="shoppingSections">
            <div class="section-row"><span class="section-name">Mercadona</span><span class="count">3</span></div>
            <div class="section-row"><span class="section-name">Lidl</span><span class="count">1</span></div>
            <div class="section-row no-section"><span class="section-name">Sin sección</span><span class="count">1</span></div>
          </div>
        </section>
        <section class="category">
          <button class="category-toggle" aria-expanded="true" aria-controls="universitySections" style="--color:var(--blue)">
            <span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></span>
            <span class="category-name">Universidad</span><span class="count">2</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <div class="sections" id="universitySections">
            <div class="section-row"><span class="section-name">Redes</span><span class="count">1</span></div>
            <div class="section-row"><span class="section-name">Bases de datos</span><span class="count">1</span></div>
          </div>
        </section>
        <section class="category">
          <button class="category-toggle" aria-expanded="false" aria-controls="healthSections" style="--color:var(--green)">
            <span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg></span>
            <span class="category-name">Salud</span><span class="count">2</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button><div class="sections" id="healthSections" hidden></div>
        </section>
        <section class="category">
          <button class="category-toggle" aria-expanded="false" aria-controls="personalSections" style="--color:var(--orange)">
            <span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span>
            <span class="category-name">Personal</span><span class="count">3</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button><div class="sections" id="personalSections" hidden></div>
        </section>
        <section class="category">
          <button class="category-toggle" aria-expanded="false" aria-controls="homeSections" style="--color:var(--pink)">
            <span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg></span>
            <span class="category-name">Casa</span><span class="count">1</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button><div class="sections" id="homeSections" hidden></div>
        </section>
      </div>
    </main>
    <div class="actions"><button class="new-category" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nueva categoría</button></div>
    <nav class="bottom-nav" aria-label="Navegación principal">
      <a class="nav-link" href="c-hoy.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/><path d="m2 7 1 1 2-2M2 12l1 1 2-2M2 17l1 1 2-2"/></svg></span><span class="nav-label">Hoy</span></a>
      <a class="nav-link" href="#"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 6 5h12l3 5.5v7a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="M3 11h5l1.5 2h5L16 11h5"/></svg></span><span class="nav-label">Bandeja</span></a>
      <a class="nav-link active" href="c-categorias.html" aria-current="page"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></span><span class="nav-label">Categorías</span></a>
      <a class="nav-link" href="#"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span class="nav-label">Pendientes</span><span class="badge">2</span></a>
      <a class="nav-link" href="#"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></span><span class="nav-label">Historial</span></a>
    </nav>
  </div>
  <script>
    document.querySelectorAll(".category-toggle").forEach((button) => {
      button.addEventListener("click", () => {
        const isExpanded = button.getAttribute("aria-expanded") === "true";
        const sections = document.getElementById(button.getAttribute("aria-controls"));
        button.setAttribute("aria-expanded", String(!isExpanded));
        sections.hidden = isExpanded;
      });
    });
  </script>
</body>
</html>
