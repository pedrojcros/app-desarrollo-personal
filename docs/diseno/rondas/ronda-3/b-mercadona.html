ton data-key="y" tabindex="-1">y</button><button data-key="u" tabindex="-1">u</button><button data-key="i" tabindex="-1">i</button><button data-key="o" tabindex="-1">o</button><button data-key="p" tabindex="-1">p</button></div><div class="key-row "><button data-key="a" tabindex="-1">a</button><button data-key="s" tabindex="-1">s</button><button data-key="d" tabindex="-1">d</button><button data-key="f" tabindex="-1">f</button><button data-key="g" tabindex="-1">g</button><button data-key="h" tabindex="-1">h</button><button data-key="j" tabindex="-1">j</button><button data-key="k" tabindex="-1">k</button><button data-key="l" tabindex="-1">l</button><button data-key="ñ" tabindex="-1">ñ</button></div><div class="key-row third"><button class="wide" aria-label="Mayúsculas" data-key="shift">⇧</button><button data-key="z" tabindex="-1">z</button><button data-key="x" tabindex="-1">x</button><button data-key="c" tabindex="-1">c</button><button data-key="v" tabindex="-1">v</button><button data-key="b" tabindex="-1">b</button><button data-key="n" tabindex="-1">n</button><button data-key="m" tabindex="-1">m</button><button class="wide" aria-label="Borrar" data-key="delete">⌫</button></div><div class="key-row bottom"><button data-key="numbers">?123</button><button data-key=",">,</button><button class="space" data-key=" ">Español</button><button data-key=".">.</button><button class="enter" data-key="send" aria-label="Enviar">↵</button></div><div class="keyboard-footer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.1M10 9h.1M14 9h.1M18 9h.1M6 13h.1M10 13h.1M14 13h.1M18 13h.1M7 16h10"/></svg></div><div class="home-bar"></div></div><script>
const taskList = document.getElementById('task-list');
let lastMarked = null;
let markedCount = 2;
function updateProgress() {
 const progress = document.getElementById('progress');
 if (progress) progress.textContent = markedCount + ' de 8 marcadas';
}
document.addEventListener('click', function(event) {
 const markButton = event.target.closest('.mark');
 if (!markButton) return;
 const taskRow = markButton.closest('.row');
 lastMarked = {row: taskRow, parent: taskRow.parentElement, next: taskRow.nextSibling};
 taskRow.remove();
 markedCount += 1;
 updateProgress();
 const toast = document.getElementById('toast-message');
 if (toast) {
  toast.textContent = markButton.classList.contains('yes') ? 'Marcada como hecha' : 'Marcada como no hecha';
  document.querySelector('.toast').hidden = false;
 }
});
const undoButton = document.getElementById('undo');
if (undoButton) undoButton.addEventListener('click', function() {
 if (lastMarked) {
  lastMarked.parent.insertBefore(lastMarked.row, lastMarked.next);
  lastMarked = null;
 } else {
  const restoredRow = document.createElement('div');
  restoredRow.className = 'row';
  restoredRow.style.setProperty('--category', 'var(--health)');
  restoredRow.innerHTML = '<div class="task-text"><span class="task-name">Meditar 10 min</span><span class="meta"><i class="dot"></i>Salud · Hábito</span></div>';
  appendMarkButtons(restoredRow, 'Meditar 10 min');
  taskList.querySelector('section:nth-child(2)').append(restoredRow);
 }
 markedCount = Math.max(0, markedCount - 1);
 updateProgress();
 document.querySelector('.toast').hidden = true;
});
function appendMarkButtons(taskRow, title) {
 for (const outcome of ['yes', 'no']) {
  const markButton = document.createElement('button');
  markButton.type = 'button';
  markButton.className = 'mark ' + outcome;
  markButton.setAttribute('aria-label', 'Marcar ' + title + (outcome === 'yes' ? ' como hecho' : ' como no hecho'));
  markButton.innerHTML = outcome === 'yes' ? '<span>✓</span>' : '✕';
  taskRow.append(markButton);
 }
}
const composer = document.getElementById('composer');
if (composer) {
 const nameInput = document.getElementById('task-name');
 const cursor = document.querySelector('.cursor');
 let mode = 'task';
 let selectedDate = document.querySelector('[data-date].selected').dataset.date;
 function hideCursor() { cursor.hidden = true; }
 nameInput.addEventListener('input', hideCursor);
 nameInput.addEventListener('focus', hideCursor);
 nameInput.focus({preventScroll: true});
 nameInput.setSelectionRange(nameInput.value.length, nameInput.value.length);
 cursor.hidden = false;
 document.querySelector('[aria-label="Cuándo"]').addEventListener('change', function(event) {
  if (event.target.value !== 'A una hora') return;
  document.querySelector('.extra').hidden = false;
  document.getElementById('more').setAttribute('aria-expanded', 'true');
  document.querySelector('[aria-label="Hora exacta"]').focus();
 });
 for (const modeButton of document.querySelectorAll('[data-mode]')) {
  modeButton.addEventListener('click', function() {
   mode = modeButton.dataset.mode;
   for (const otherButton of document.querySelectorAll('[data-mode]')) {
    const selected = otherButton === modeButton;
    otherButton.classList.toggle('selected', selected);
    otherButton.setAttribute('aria-pressed', String(selected));
   }
   document.querySelector('.habit-options').hidden = mode !== 'habit';
   document.querySelector('.start-label').hidden = mode !== 'habit';
   document.querySelector('[data-date="Sin fecha"]').hidden = mode === 'habit';
   if (mode === 'habit' && selectedDate === 'Sin fecha') document.querySelector('[data-date="Hoy"]').click();
  });
 }
 for (const dateButton of document.querySelectorAll('[data-date]')) {
  dateButton.addEventListener('click', function() {
   selectedDate = dateButton.dataset.date;
   document.getElementById('calendar').classList.remove('selected');
   for (const otherButton of document.querySelectorAll('[data-date]')) {
    const selected = otherButton === dateButton;
    otherButton.classList.toggle('selected', selected);
    otherButton.setAttribute('aria-pressed', String(selected));
   }
  });
 }
 document.getElementById('calendar').addEventListener('click', function() {
  const dateInput = document.getElementById('custom-date');
  dateInput.hidden = !dateInput.hidden;
 });
 document.getElementById('custom-date').addEventListener('change', function(event) {
  selectedDate = event.target.value;
  for (const dateButton of document.querySelectorAll('[data-date]')) {
   dateButton.classList.remove('selected');
   dateButton.setAttribute('aria-pressed', 'false');
  }
  document.getElementById('calendar').classList.add('selected');
 });
 document.getElementById('more').addEventListener('click', function(event) {
  const extra = document.querySelector('.extra');
  extra.hidden = !extra.hidden;
  event.currentTarget.setAttribute('aria-expanded', String(!extra.hidden));
 });
 composer.addEventListener('submit', function(event) {
  event.preventDefault();
  const title = nameInput.value.trim();
  if (!title) { nameInput.focus(); return; }
  const category = document.getElementById('category').value;
  const taskRow = document.createElement('div');
  taskRow.className = 'row';
  taskRow.style.setProperty('--category', 'var(--accent)');
  const text = document.createElement('div');
  text.className = 'task-text';
  const name = document.createElement('span');
  name.className = 'task-name';
  name.textContent = title;
  const metadata = document.createElement('span');
  metadata.className = 'meta';
  metadata.textContent = selectedDate + ' · ' + category + ' · ' + (mode === 'task' ? 'Tarea' : 'Hábito');
  text.append(name, metadata);
  taskRow.append(text);
  appendMarkButtons(taskRow, title);
  const destination = taskList.querySelector('section') || taskList;
  const heading = destination.querySelector('h2');
  if (heading) heading.after(taskRow);
  else destination.prepend(taskRow);
  const pendingCount = document.querySelector('header .count');
  if (pendingCount && !document.getElementById('progress')) pendingCount.textContent = taskList.querySelectorAll('.row').length + ' pendientes';
  nameInput.value = '';
  nameInput.placeholder = 'Añadir otra…';
  nameInput.focus();
  hideCursor();
 });
 for (const key of document.querySelectorAll('[data-key]')) {
  key.addEventListener('click', function() {
   const value = key.dataset.key;
   if (value === 'send') { composer.requestSubmit(); return; }
   if (value === 'shift') {
    for (const letterKey of document.querySelectorAll('[data-key]')) {
     if (letterKey.dataset.key.length === 1) letterKey.dataset.key = letterKey.dataset.key.toUpperCase();
     if (letterKey.dataset.key.length === 1) letterKey.textContent = letterKey.dataset.key;
    }
    return;
   }
   if (value === 'numbers') {
    const digits = '1234567890';
    const firstRow = document.querySelector('.key-row');
    for (const [index, digitKey] of Array.from(firstRow.children).entries()) {
     digitKey.dataset.key = digits[index];
     digitKey.textContent = digits[index];
    }
    return;
   }
   if (value === 'delete') nameInput.value = nameInput.value.slice(0, -1);
   else nameInput.value += value;
   hideCursor();
   nameInput.focus();
  });
 }
}
for (const creationButton of document.querySelectorAll('[data-create]')) {
 creationButton.addEventListener('click', function() {
  const title = window.prompt(creationButton.dataset.create === 'section' ? 'Nombre de la sección' : 'Nombre de la categoría');
  if (!title || !title.trim()) return;
  const item = document.createElement(creationButton.dataset.create === 'section' ? 'h2' : 'div');
  item.className = creationButton.dataset.create === 'section' ? 'category-heading' : 'category-row';
  item.textContent = title.trim();
  document.querySelector('.creation-actions').before(item);
 });
}
</script></body></html>
