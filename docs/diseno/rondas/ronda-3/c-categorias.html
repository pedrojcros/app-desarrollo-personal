<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categorías · Estilo C</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --background: #fffbef;
      --surface: #ffffff;
      --surface-soft: #f4efdf;
      --ink: #111111;
      --muted: #4a4a4a;
      --accent: #ffe14d;
      --university: #8ab4ff;
      --health: #6ee7a8;
      --personal: #ffb86b;
      --home: #ff8fb1;
      --line: rgba(17, 17, 17, 0.16);
      --stroke: 1.5px solid var(--ink);
      --shadow: 2px 2px 0 var(--ink);
    }

    * { box-sizing: border-box; }

    body {
      width: 100%;
      min-width: 320px;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: var(--background);
      color: var(--ink);
      font-family: "Archivo", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { color: inherit; font: inherit; }
    .icon { display: block; flex: none; }

    .app {
      position: relative;
      display: flex;
      width: min(100%, 480px);
      height: 100%;
      flex-direction: column;
      margin: 0 auto;
      padding: 18px 16px 0;
      overflow: hidden;
    }

    /* Cabecera */
    .page-header {
      display: flex;
      min-height: 76px;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 0 1px 12px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1.4px;
      line-height: 1.02;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 500;
    }

    .counter { display: grid; justify-items: end; gap: 6px; padding-top: 2px; }

    .counter-badge {
      padding: 3px 7px 4px;
      border: var(--stroke);
      background: var(--accent);
      box-shadow: var(--shadow);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.4px;
      line-height: 1;
    }

    .counter-bar { display: flex; gap: 2px; }
    .counter-bar i { width: 8px; height: 9px; border: 1px solid var(--ink); background: var(--surface); }
    .counter-bar i.is-full { background: var(--ink); }

    .counter-caption { color: var(--muted); font-size: 10px; font-weight: 500; }

    /* Contenido con scroll */
    .content {
      min-height: 0;
      flex: 1;
      padding-bottom: 10px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .content::-webkit-scrollbar { display: none; }

    .group { margin-top: 6px; }

    .group-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 0;
      padding: 0 1px 6px;
      border-bottom: var(--stroke);
      color: var(--ink);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Filas sin cajitas: solo una línea fina entre ellas */
    .rows { display: block; }

    .row {
      display: flex;
      min-height: 58px;
      align-items: center;
      gap: 4px;
      padding: 3px 0 3px 1px;
      border-bottom: 1px solid var(--line);
    }

    .row.is-new { animation: flash 1.2s ease-out; }
    @keyframes flash { from { background: var(--accent); } to { background: transparent; } }

    .row-info { min-width: 0; flex: 1; }

    .row-name {
      display: block;
      overflow: hidden;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-meta {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border: 1px solid var(--ink);
      border-radius: 50%;
      background: var(--surface);
    }
    .dot-university { background: var(--university); }
    .dot-health { background: var(--health); }
    .dot-personal { background: var(--personal); }
    .dot-home { background: var(--home); }
    .dot-accent { background: var(--accent); }

    .row-actions { display: flex; align-items: center; }

    .mark {
      display: grid;
      width: 44px;
      height: 48px;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .mark span {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: var(--stroke);
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 1px 1px 0 var(--ink);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
    }
    .mark.done[data-category="health"] span { background: var(--health); }
    .mark.done[data-category="personal"] span { background: var(--personal); }
    .mark.done[data-category="university"] span { background: var(--university); }
    .mark.done[data-category="home"] span { background: var(--home); }
    .mark.done[data-category="accent"] span { background: var(--accent); }
    .mark.done[data-category="none"] span { background: var(--accent); }

    .mark:active span { transform: translate(1px, 1px); box-shadow: none; }

    .mark:focus-visible, .nav-link:focus-visible, .fab:focus-visible,
    .undo-button:focus-visible, .button:focus-visible, .chip:focus-visible,
    .seg:focus-visible, .send:focus-visible, .key:focus-visible,
    .list-link:focus-visible, .back:focus-visible, .more-button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
    }

    /* Botón + */
    .fab {
      position: absolute;
      z-index: 3;
      right: 18px;
      bottom: 137px;
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border: var(--stroke);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 3px 3px 0 var(--ink);
      cursor: pointer;
    }

    /* Aviso */
    .toast {
      display: flex;
      min-height: 48px;
      flex: 0 0 48px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 2px 0 10px;
      padding: 0 6px 0 14px;
      border: var(--stroke);
      background: var(--ink);
      box-shadow: var(--shadow);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
    }
    .toast[hidden] { display: none; }
    .toast-message { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .undo-button {
      min-width: 70px;
      min-height: 44px;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      text-align: right;
      cursor: pointer;
    }

    /* Navegación inferior */
    .bottom-nav {
      display: grid;
      min-height: 69px;
      flex: 0 0 69px;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      margin: 0 -16px;
      padding: 4px 7px 7px;
      border-top: var(--stroke);
      background: var(--surface);
    }

    .nav-link {
      display: flex;
      min-width: 0;
      min-height: 52px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 600;
      text-decoration: none;
    }

    .nav-icon {
      position: relative;
      display: grid;
      width: 40px;
      height: 26px;
      place-items: center;
      border-radius: 999px;
    }

    .nav-link[aria-current="page"] { color: var(--ink); font-weight: 800; }
    .nav-link[aria-current="page"] .nav-icon { background: var(--accent); box-shadow: 1px 1px 0 var(--ink); }

    .nav-count {
      position: absolute;
      top: -5px;
      right: -1px;
      display: grid;
      width: 16px;
      height: 16px;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 50%;
      background: var(--personal);
      color: var(--ink);
      font-size: 9px;
      font-weight: 800;
    }

    /* Botones */
    .button {
      display: inline-flex;
      min-height: 48px;
      flex: 1;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      border: var(--stroke);
      background: var(--surface);
      box-shadow: var(--shadow);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.1px;
      cursor: pointer;
    }
    .button.is-primary { background: var(--accent); }
    .button:active { transform: translate(2px, 2px); box-shadow: none; }

    @media (min-width: 400px) {
      .app { padding-right: 20px; padding-left: 20px; }
      .bottom-nav { margin-right: -20px; margin-left: -20px; }
    }

    .list-link {
      position: relative;
      display: flex;
      min-height: 54px;
      align-items: center;
      gap: 12px;
      padding: 0 2px 0 1px;
      border-bottom: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
    }
    .list-link:active { background: var(--surface-soft); }
    .marker { display: grid; width: 24px; flex: none; place-items: center; }

    .swatch {
      width: 16px;
      height: 16px;
      border: var(--stroke);
      border-radius: 50%;
      background: var(--surface);
    }
    .swatch.dot-university { background: var(--university); }
    .swatch.dot-health { background: var(--health); }
    .swatch.dot-personal { background: var(--personal); }
    .swatch.dot-home { background: var(--home); }
    .swatch.dot-accent { background: var(--accent); }

    .list-name { flex: 1; min-width: 0; overflow: hidden; font-size: 16px; font-weight: 700; letter-spacing: -0.2px; text-overflow: ellipsis; white-space: nowrap; }

    .count {
      display: grid;
      min-width: 28px;
      height: 24px;
      place-items: center;
      padding: 0 6px;
      border: var(--stroke);
      background: var(--surface);
      font-size: 13px;
      font-weight: 800;
    }
    .chevron { color: var(--muted); }

    .section-head {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 50px;
      padding: 0 1px;
    }
    .section-icon {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: var(--stroke);
      background: var(--accent);
      box-shadow: var(--shadow);
    }
    .section-name { flex: 1; font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; }
    .section-total { color: var(--muted); font-size: 11px; font-weight: 600; }

    .folder { margin-left: 14px; padding-left: 14px; border-left: 2px solid var(--ink); }
    .folder .list-link:last-child { border-bottom: 0; }
    .folder + .group, .group + .group { margin-top: 16px; }

    .create-bar {
      display: flex;
      gap: 12px;
      padding: 10px 1px 14px;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="page-header">
      <div>
        <h1>Categorías</h1>
        <p class="subtitle">Lo que queda pendiente en cada una</p>
      </div>
    </header>
    <div class="content">
      <a class="list-link" href="#"><span class="marker"><svg class="icon " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></span><span class="list-name">Bandeja de entrada</span><span class="count">1</span><svg class="icon chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>

      <section class="group" aria-label="Lista de la compra">
        <div class="section-head">
          <span class="section-icon"><svg class="icon " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></span>
          <span class="section-name">Lista de la compra</span>
          <span class="section-total">4 pendientes</span>
        </div>
        <div class="folder">
          <a class="list-link is-nested" href="#"><span class="marker"><span class="swatch dot-health"></span></span><span class="list-name">Mercadona</span><span class="count">3</span><svg class="icon chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
          <a class="list-link is-nested" href="#"><span class="marker"><span class="swatch dot-accent"></span></span><span class="list-name">Lidl</span><span class="count">1</span><svg class="icon chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
        </div>
      </section>

      <section class="group" aria-label="Sin sección">
        <h2 class="group-title">Sin sección</h2>
        <a class="list-link" href="#"><span class="marker"><span class="swatch dot-university"></span></span><span class="list-name">Universidad</span><span class="count">2</span><svg class="icon chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
        <a class="list-link" href="#"><span class="marker"><span class="swatch dot-health"></span></span><span class="list-name">Salud</span><span class="count">2</span><svg class="icon chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
        <a class="list-link" href="#"><span class="marker"><span class="swatch dot-personal"></span></span><span class="list-name">Personal</span><span class="count">3</span><svg class="icon chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
        <a class="list-link" href="#"><span class="marker"><span class="swatch dot-home"></span></span><span class="list-name">Casa</span><span class="count">1</span><svg class="icon chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
      </section>
    </div>
    <div class="create-bar">
      <button class="button" type="button"><svg class="icon " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>Sección</button>
      <button class="button is-primary" type="button"><svg class="icon " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>Categoría</button>
    </div>
    <nav class="bottom-nav" aria-label="Navegación principal"><a class="nav-link" href="#"><span class="nav-icon"><svg class="icon " width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="m3 6 1 1 2-2m-3 7 1 1 2-2m-3 7 1 1 2-2"/></svg></span>Hoy</a><a class="nav-link" href="#"><span class="nav-icon"><svg class="icon " width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></span>Bandeja</a><a class="nav-link" href="#" aria-current="page"><span class="nav-icon"><svg class="icon " width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>Categorías</a><a class="nav-link" href="#"><span class="nav-icon"><svg class="icon " width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8M8 20h8M6 4h12v16H6z"/><path d="M9 8h6m-6 4h6m-6 4h4"/></svg><span class="nav-count">2</span></span>Pendientes</a><a class="nav-link" href="#"><span class="nav-icon"><svg class="icon " width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5m4-1v5l3 2"/></svg></span>Historial</a></nav>
  </main>
  <script>
    /* Pantalla estática: la navegación es de muestra. */
  </script>
</body>
</html>
