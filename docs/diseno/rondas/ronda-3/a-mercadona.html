<script>
const taskList = document.querySelector('#task-list');
const toast = document.querySelector('.toast');
let lastMark = null;
let markedCount = 2;
let totalCount = 8;
function showToast(message) {
  if (!toast) return;
  toast.hidden = false;
  toast.querySelector('.toast-message').textContent = message;
}
function bindMarks(container) {
  for (const button of container.querySelectorAll('.mark')) {
    button.addEventListener('click', function () {
      const taskRow = button.closest('.task-row');
      const marker = document.createComment('Lugar de la fila');
      taskRow.before(marker);
      lastMark = { taskRow, marker };
      taskRow.remove();
      markedCount += 1;
      const progress = document.querySelector('.progress');
      if (progress) progress.textContent = markedCount + ' de ' + totalCount;
      let message = 'Marcada como no hecha';
      if (button.classList.contains('yes')) message = 'Marcada como hecha';
      showToast(message);
    });
  }
}
if (taskList) bindMarks(taskList);
const undo = document.querySelector('#undo');
if (undo) {
  undo.addEventListener('click', function () {
    if (lastMark) {
      lastMark.marker.replaceWith(lastMark.taskRow);
      lastMark = null;
    } else {
      const restoredRow = document.createElement('div');
      restoredRow.className = 'task-row';
      restoredRow.style.setProperty('--category', 'var(--health)');
      restoredRow.innerHTML = '<div class="task-copy"><div class="task-name">Meditar 10 min</div><div class="metadata"><span class="dot"></span>Salud</div></div><button class="mark yes" aria-label="Marcar Meditar 10 min como hecho"><span>✓</span></button><button class="mark no" aria-label="Marcar Meditar 10 min como no hecho">✕</button>';
      document.querySelector('#no-time').append(restoredRow);
      bindMarks(restoredRow);
    }
    markedCount -= 1;
    document.querySelector('.progress').textContent = markedCount + ' de ' + totalCount;
    toast.hidden = true;
  });
}
const composer = document.querySelector('#composer');
if (composer) {
  const nameInput = document.querySelector('#task-name');
  let currentMode = 'task';
  for (const button of document.querySelectorAll('[data-mode]')) {
    button.addEventListener('click', function () {
      currentMode = button.dataset.mode;
      for (const modeButton of document.querySelectorAll('[data-mode]')) {
        const selected = modeButton === button;
        modeButton.classList.toggle('selected', selected);
        modeButton.setAttribute('aria-pressed', String(selected));
      }
      const isHabit = currentMode === 'habit';
      document.querySelector('.habit-options').hidden = !isHabit;
      document.querySelector('.start-label').hidden = !isHabit;
      const noDate = document.querySelector('[data-date="Sin fecha"]');
      noDate.hidden = isHabit;
      if (isHabit && noDate.classList.contains('selected')) {
        document.querySelector('[data-date="Hoy"]').click();
      }
      nameInput.focus();
    });
  }
  for (const button of document.querySelectorAll('[data-date]')) {
    button.addEventListener('click', function () {
      for (const dateButton of document.querySelectorAll('[data-date]')) {
        const selected = dateButton === button;
        dateButton.classList.toggle('selected', selected);
        dateButton.setAttribute('aria-pressed', String(selected));
      }
    });
  }
  const dateInput = document.querySelector('#custom-date');
  document.querySelector('.calendar').addEventListener('click', function () {
    dateInput.hidden = false;
    dateInput.showPicker();
  });
  dateInput.addEventListener('change', function () {
    for (const button of document.querySelectorAll('[data-date]')) {
      button.classList.remove('selected');
      button.setAttribute('aria-pressed', 'false');
    }
    document.querySelector('.calendar').classList.add('selected');
    dateInput.hidden = true;
  });
  document.querySelector('.more').addEventListener('click', function () {
    const extra = document.querySelector('.extra');
    extra.hidden = !extra.hidden;
    this.setAttribute('aria-expanded', String(!extra.hidden));
  });
  document.querySelector('.dismiss').addEventListener('click', function () {
    composer.hidden = true;
    document.querySelector('.keyboard').hidden = true;
    const reopen = document.createElement('button');
    reopen.className = 'add';
    reopen.setAttribute('aria-label', 'Añadir');
    reopen.textContent = '+';
    reopen.style.bottom = '24px';
    document.body.append(reopen);
    reopen.addEventListener('click', function () {
      composer.hidden = false;
      document.querySelector('.keyboard').hidden = false;
      reopen.remove();
      nameInput.focus();
    });
  });
  composer.addEventListener('submit', function (event) {
    event.preventDefault();
    const taskName = nameInput.value.trim();
    if (!taskName) {
      nameInput.focus();
      return;
    }
    const taskRow = document.createElement('div');
    taskRow.className = 'task-row';
    taskRow.style.setProperty('--category', 'var(--health)');
    const taskCopy = document.createElement('div');
    taskCopy.className = 'task-copy';
    const title = document.createElement('div');
    title.className = 'task-name';
    title.textContent = taskName;
    const metadata = document.createElement('div');
    metadata.className = 'metadata';
    const selectedDate = document.querySelector('[data-date].selected');
    let dateLabel = dateInput.value;
    if (selectedDate) dateLabel = selectedDate.dataset.date;
    const category = document.querySelector('.category-selector').value;
    let details = dateLabel + ' · ' + category;
    if (currentMode === 'habit') {
      const frequency = document.querySelector('.habit-options select').value;
      details = frequency + ' · ' + category;
    }
    metadata.textContent = details;
    taskCopy.append(title, metadata);
    taskRow.append(taskCopy);
    for (const state of ['yes', 'no']) {
      const mark = document.createElement('button');
      mark.className = 'mark ' + state;
      let label = 'Marcar ' + taskName + ' como no hecho';
      let symbol = '✕';
      if (state === 'yes') {
        label = 'Marcar ' + taskName + ' como hecho';
        symbol = '✓';
      }
      mark.setAttribute('aria-label', label);
      const markSymbol = document.createElement('span');
      markSymbol.textContent = symbol;
      mark.append(markSymbol);
      taskRow.append(mark);
    }
    taskList.prepend(taskRow);
    totalCount += 1;
    bindMarks(taskRow);
    taskList.scrollTop = 0;
    nameInput.value = '';
    nameInput.focus();
  });
  let uppercase = false;
  for (const button of document.querySelectorAll('[data-key]')) {
    button.addEventListener('click', function () {
      const key = button.dataset.key;
      if (key === 'enter') {
        composer.requestSubmit();
        return;
      }
      if (key === 'shift') {
        uppercase = !uppercase;
        return;
      }
      if (key === 'numbers') {
        nameInput.focus();
        return;
      }
      if (key === 'delete') {
        nameInput.value = nameInput.value.slice(0, -1);
      } else {
        let letter = key;
        if (uppercase) letter = key.toUpperCase();
        nameInput.value += letter;
      }
      nameInput.focus();
    });
  }
  nameInput.focus();
  nameInput.setSelectionRange(nameInput.value.length, nameInput.value.length);
}
for (const button of document.querySelectorAll('[data-create]')) {
  button.addEventListener('click', function () {
    const isSection = button.dataset.create === 'section';
    let question = 'Nombre de la categoría';
    if (isSection) question = 'Nombre de la sección';
    const name = window.prompt(question);
    if (!name || !name.trim()) return;
    const element = document.createElement('div');
    element.textContent = name.trim();
    element.className = 'category-row';
    if (isSection) element.className = 'section-title';
    document.querySelector('.category-actions').before(element);
  });
}
</script></body></html>
