:root{--background:#1636C4;--surface:#1F42D6;--surface2:#2A4EE2;--border:#4565EE;--text:#fff;--muted:#C7D2FF;--health:#8BF0BC;--personal:#FFD866;--university:#9BE3FF;--failure:#FF9C8A}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:13px 'Plus Jakarta Sans',sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #FFD866;outline-offset:3px}a{color:inherit;text-decoration:none}button{color:inherit;background:none;border:0}svg{width:22px;height:22px;flex-shrink:0}main{padding:26px 20px 170px;max-width:520px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:27px}h1{font-size:29px;letter-spacing:-1.2px;margin:0 0 7px;font-weight:800}p{margin:0;color:var(--muted);font-size:12px}.progress{font-size:13px;font-weight:700;white-space:nowrap;padding-left:10px}.section-title{font-size:10px;font-weight:700;letter-spacing:1.8px;color:var(--muted);text-transform:uppercase;margin:15px 0 7px}.row{display:flex;align-items:center;min-height:59px;border-bottom:1px solid var(--border);gap:2px}.row-info{flex:1;min-width:0}.row-name{font-size:13px;font-weight:600;line-height:19px}.meta{font-size:10px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:5px}.dot{width:5px;height:5px;border-radius:50%;background:var(--category)}.mark{width:44px;height:44px;display:flex;align-items:center;justify-content:center}.mark.done{color:var(--category)}.mark.done svg{background:var(--surface2);border-radius:50%;width:32px;height:32px;padding:6px}.mark.no{color:var(--failure)}.mark.no svg{width:19px}.navigation{position:fixed;bottom:0;left:0;right:0;height:80px;background:var(--background);border-top:1px solid var(--border);display:flex;padding:9px 6px 12px;z-index:3}.tab{flex:1;text-align:center;color:var(--muted);font-size:9px;font-weight:500}.tab-icon{width:48px;height:32px;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 5px;position:relative}.active{color:#fff;font-weight:700}.active .tab-icon{background:#fff;color:var(--background)}.badge{position:absolute;right:2px;top:-3px;background:#fff;color:var(--background);border-radius:8px;font-size:9px;padding:1px 4px;font-weight:800}.fab{position:fixed;bottom:150px;right:20px;background:#fff;color:var(--background);border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 16px #102b9840;z-index:2}.fab svg{width:26px;height:26px}.toast{position:fixed;bottom:92px;left:20px;right:20px;border:1px solid var(--border);background:var(--surface2);border-radius:12px;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding-left:12px;font-size:10px;z-index:2}.toast button{min-height:46px;padding:0 12px;font-size:11px;font-weight:800}.segments{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:22px}.segments button{min-height:40px;flex:1;color:var(--muted);font-size:12px;font-weight:600;border-radius:8px}.segments button.selected{background:#fff;color:var(--background)}.range-caption{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;color:var(--muted);font-size:11px}.range-caption button{width:44px;height:44px}.history{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 8px}.table-row{display:flex;align-items:center}.habit-name{width:104px;flex-shrink:0;font-size:10px;font-weight:600;line-height:15px;padding-right:6px}.cells{display:flex;flex:1;justify-content:space-around;min-width:0}.cell{width:26px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}.cell.today{background:var(--surface2)}.cell.yes{color:var(--category);font-weight:800}.cell.no{color:var(--failure);font-weight:700}.cell.empty{color:transparent}.table-row.data{border-top:1px solid var(--border)}.days .cell{flex-direction:column;font-size:9px;gap:5px;height:54px;min-height:54px}.days strong{font-size:12px}.days .today{border-radius:8px 8px 0 0;color:#fff}.percent .cell{font-size:9px;min-height:35px;font-weight:700}.percent .today{border-radius:0 0 8px 8px}.legend{display:flex;flex-wrap:wrap;gap:13px;font-size:10px;color:var(--muted);margin-top:18px;line-height:18px}.legend b{font-size:13px;margin-right:4px}.form-main{padding:20px 20px 24px}.form-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.form-top a{width:44px;height:44px;display:flex;align-items:center}.form-top h1{font-size:24px;margin:0}.form-top span{width:44px}.form-main .segments{margin-bottom:22px}label,.field-title{display:block;font-size:11px;font-weight:600;margin-bottom:8px;color:var(--muted)}.field{margin-bottom:18px}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:10px;min-height:48px;background:var(--surface);color:#fff;padding:12px;outline:none}select{appearance:none;padding-right:30px}option{background:var(--surface)}.select-wrap{position:relative}.select-wrap:after{content:'⌄';position:absolute;right:15px;top:14px;pointer-events:none}.weekdays{display:flex;gap:4px;margin-top:10px}.weekdays button{flex:1;min-width:0;height:44px;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-weight:700}.weekdays button.selected{background:#fff;color:var(--background);border-color:#fff}.dual{display:flex;gap:10px}.dual>*{flex:1;min-width:0}.native-field{position:relative}.native-field svg{position:absolute;right:13px;top:13px;width:19px;color:var(--muted);pointer-events:none}.native-field input{padding-right:38px}input::-webkit-calendar-picker-indicator{opacity:0;position:absolute;right:0;width:40px;cursor:pointer}.helper{font-size:10px;margin-top:7px;line-height:16px}.create-button{background:#fff;color:var(--background);width:100%;height:52px;border-radius:12px;font-weight:800;margin-top:6px;font-size:14px}.form-note{text-align:center;margin-top:12px;font-size:10px}.hidden{display:none!important}@media(min-width:400px){main{padding-top:32px}.row{min-height:73px}.cell{min-height:60px}.form-main .field{margin-bottom:24px}}
</style></head><body><main class="form-main"><div class="form-top"><a href="d-hoy.html" aria-label="Volver a Hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></a><h1>Crear</h1><span></span></div><div class="segments" aria-label="Tipo de actividad"><button id="task-tab" aria-pressed="false">Tarea</button><button id="habit-tab" class="selected" aria-pressed="true">Hábito</button></div><form id="create-form"><div class="field"><label for="name">Nombre</label><input id="name" value="Ir al gimnasio" required placeholder="¿Qué quieres hacer?"></div><div id="habit-fields"><div class="field"><label for="frequency">Frecuencia</label><div class="select-wrap"><select id="frequency"><option>A diario</option><option selected>Días de la semana</option><option>Cada N días</option><option>Cada mes</option></select></div><div class="weekdays" id="weekdays"><button type="button" class="selected" aria-pressed="true" aria-label="Lunes">L</button><button type="button" class="" aria-pressed="false" aria-label="Martes">M</button><button type="button" class="selected" aria-pressed="true" aria-label="Miércoles">X</button><button type="button" class="" aria-pressed="false" aria-label="Jueves">J</button><button type="button" class="selected" aria-pressed="true" aria-label="Viernes">V</button><button type="button" class="" aria-pressed="false" aria-label="Sábado">S</button><button type="button" class="" aria-pressed="false" aria-label="Domingo">D</button></div><input id="interval" class="hidden" type="number" min="1" value="2" aria-label="Número de días"><input id="month-day" class="hidden" type="number" min="1" max="31" value="6" aria-label="Día del mes"></div><div class="field"><span class="field-title">Cuándo</span><div class="dual"><div class="select-wrap"><select id="timing" aria-label="Franja o una hora"><option>A una hora</option><option>Mañana</option><option>Tarde</option><option>Noche</option></select></div><div class="native-field"><input id="habit-time" type="text" value="18:30" data-native="time" aria-label="Hora del hábito"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div></div></div></div><div id="task-fields" class="hidden"><div class="field"><label for="notes">Notas</label><textarea id="notes" rows="2" placeholder="Añade un detalle (opcional)"></textarea></div><div class="dual field"><div><label for="task-date">Fecha · opcional</label><input id="task-date" type="date"></div><div><label for="task-time">Hora · opcional</label><input id="task-time" type="time"></div></div><p class="helper">Sin fecha, irá a la Bandeja de entrada.</p></div><div class="field"><label for="category">Categoría</label><div class="select-wrap"><select id="category"><option>Sin categoría · Bandeja</option><option>Universidad</option><option selected>Salud</option><option>Personal</option><option>Casa</option></select></div></div><div class="field" id="start-field"><label for="start-date">Fecha de inicio</label><div class="native-field"><input id="start-date" type="text" value="6 de octubre de 2026" data-native="date" data-date="2026-10-06"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18"/></svg></div><p class="helper">Hoy, 6 de octubre de 2026</p></div><button class="create-button" type="submit">Crear</button><p class="form-note" id="form-note">Un pequeño paso, tres veces por semana.</p></form></main><script>const taskTab = document.getElementById('task-tab');
const habitTab = document.getElementById('habit-tab');
function setMode(isHabit) {
  habitTab.classList.toggle('selected', isHabit);
  taskTab.classList.toggle('selected', !isHabit);
  habitTab.setAttribute('aria-pressed', String(isHabit));
  taskTab.setAttribute('aria-pressed', String(!isHabit));
  document.getElementById('habit-fields').classList.toggle('hidden', !isHabit);
  document.getElementById('start-field').classList.toggle('hidden', !isHabit);
  document.getElementById('task-fields').classList.toggle('hidden', isHabit);
  document.getElementById('category').selectedIndex = isHabit ? 2 : 0;
  document.getElementById('name').value = isHabit ? 'Ir al gimnasio' : '';
  document.getElementById('form-note').textContent = isHabit ? 'Un pequeño paso, tres veces por semana.' : 'Dale espacio a lo que tienes en mente.';
}
taskTab.addEventListener('click', function() { setMode(false); });
habitTab.addEventListener('click', function() { setMode(true); });
document.querySelectorAll('.weekdays button').forEach(function(button) {
  button.addEventListener('click', function() {
    const selected = button.classList.toggle('selected');
    button.setAttribute('aria-pressed', String(selected));
  });
});
document.getElementById('frequency').addEventListener('change', function(event) {
  const selectedIndex = event.target.selectedIndex;
  document.getElementById('weekdays').classList.toggle('hidden', selectedIndex !== 1);
  document.getElementById('interval').classList.toggle('hidden', selectedIndex !== 2);
  document.getElementById('month-day').classList.toggle('hidden', selectedIndex !== 3);
});
document.getElementById('timing').addEventListener('change', function(event) {
  document.getElementById('habit-time').parentElement.classList.toggle('hidden', event.target.selectedIndex !== 0);
});
document.getElementById('create-form').addEventListener('submit', function(event) {
  event.preventDefault();
  document.getElementById('form-note').textContent = 'Creado. Ya puedes volver a Hoy.';
});document.querySelectorAll('[data-native]').forEach(function(input) {
  input.addEventListener('focus', function() {
    const currentValue = input.value;
    input.type = input.dataset.native;
    input.value = input.dataset.date || currentValue;
    if (typeof input.showPicker === 'function') {
      try {
        input.showPicker();
      } catch (error) {
        // El campo nativo sigue disponible si el navegador limita el selector.
      }
    }
  });
  input.addEventListener('blur', function() {
    const selectedValue = input.value;
    input.type = 'text';
    if (input.dataset.native === 'date' && selectedValue) {
      input.dataset.date = selectedValue;
      const calendarDate = new Date(selectedValue + 'T12:00:00');
      input.value = calendarDate.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
      return;
    }
    input.value = selectedValue;
  });
});</script></body></html>
