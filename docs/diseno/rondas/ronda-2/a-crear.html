<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear · A Blanco</title><style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap');
:root{--background:#F2ECE1;--surface:#FAF6EF;--surface2:#EAE2D4;--border:#D9CDB9;--ink:#1F1B16;--muted:#75695A;--accent:#C2410C;--no:#9C8F7E;--health:#4F7A45;--personal:#B7791F;--university:#3B5B7A}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--ink);font:14px Inter,Arial,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}svg{width:22px;height:22px;flex-shrink:0}h1,h2,p{margin:0}h1{font:500 34px Fraunces,Georgia,serif;letter-spacing:-1.2px}header{padding:30px 20px 22px;display:flex;align-items:center;justify-content:space-between}header p{color:var(--muted);font-size:12px;margin-top:8px}.count{color:var(--accent);font-weight:600;font-size:13px;align-self:center}main{padding:0 16px 174px;max-width:620px;margin:auto}.section-title{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:var(--muted);font-weight:600;margin:15px 4px 7px}.section-title:after{content:'';height:1px;background:var(--border);flex:1}.rows{border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden}.row{display:flex;align-items:center;min-height:66px;padding:7px 6px 7px 12px;gap:3px}.row+.row{border-top:1px solid var(--border)}.details{flex:1;min-width:0}.name{font-size:13px;font-weight:600;line-height:18px}.meta{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);margin-top:5px}.dot{width:5px;height:5px;border-radius:50%;background:var(--category)}.mark{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--category)}.mark svg{width:21px;height:21px}.mark.no{color:var(--muted)}.mark.no svg{width:18px;height:18px}.mark.yes:before{content:'';position:absolute;width:32px;height:32px;border-radius:50%;background:var(--category);opacity:.10}.toast{position:fixed;bottom:91px;left:16px;right:16px;border-radius:12px;background:var(--ink);color:var(--surface);padding:8px 10px 8px 14px;display:flex;align-items:center;justify-content:space-between;font-size:12px;z-index:3;min-height:52px}.toast button{border:0;background:none;color:var(--surface);font-size:12px;font-weight:700;min-height:44px;padding:0 10px}.add{position:fixed;right:20px;bottom:158px;width:52px;height:52px;background:var(--accent);color:white;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px #48200024;text-decoration:none}.add svg{width:26px;height:26px}nav{position:fixed;bottom:0;left:0;right:0;height:78px;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:9px 8px 12px;z-index:4}nav a{width:20%;text-decoration:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:9px;min-height:44px}nav .nav-icon{height:30px;width:48px;display:flex;align-items:center;justify-content:center;position:relative;border-radius:20px}nav .active{color:var(--accent);font-weight:600}nav .active .nav-icon{background:#C2410C14}.badge{position:absolute;top:-3px;right:3px;background:var(--surface2);color:var(--ink);border:2px solid var(--surface);border-radius:10px;font-size:9px;padding:1px 4px}.segment{display:flex;background:var(--surface2);border-radius:10px;padding:4px;gap:4px}.segment button{flex:1;background:none;border:0;border-radius:7px;min-height:44px;color:var(--muted);font-size:12px}.segment button.selected{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #33220c12;font-weight:600}.history-main{padding-bottom:95px}.range-caption{font-size:12px;color:var(--muted);margin:18px 2px}.matrix{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:10px 8px}.matrix-row{display:flex;align-items:center;min-height:55px;border-top:1px solid var(--border)}.matrix-label{width:106px;flex-shrink:0;font-size:11px;font-weight:500;line-height:15px;padding:0 4px}.cells{display:flex;flex:1;min-width:0}.cell{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;min-height:45px;color:var(--category)}.cell svg{width:16px;height:16px}.cell.today{background:#EAE2D47a}.cell small{font-size:9px;color:var(--muted);margin-bottom:5px}.cell b{font-size:12px}.matrix-head{border:0;min-height:55px}.matrix-head .today{color:var(--accent);border-radius:8px 8px 0 0}.matrix-row .unmarked{color:var(--muted)}.matrix-row .missed{color:var(--muted)}.progress .cell{font-size:9px;font-weight:600;color:var(--muted)}.progress .today{border-radius:0 0 8px 8px;color:var(--accent)}.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:10px;margin:15px 4px;line-height:18px}.legend span{display:flex;align-items:center;gap:4px}.legend svg{width:13px;height:13px}.history-note{font-size:11px;line-height:18px;color:var(--muted);padding:12px 4px;border-top:1px solid var(--border)}.create-header{padding:22px 20px 16px}.create-header h1{font-size:30px}.close{width:44px;height:44px;border:1px solid var(--border);background:var(--surface);border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted)}.form-main{padding:0 20px 24px}label,.field-label{display:block;font-size:11px;font-weight:600;margin:17px 0 7px}input,select,textarea{width:100%;min-height:46px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:13px}textarea{resize:vertical;height:70px}.helper{font-size:10px;color:var(--muted);line-height:16px;margin-top:6px}.weekdays{display:flex;gap:5px;margin-top:9px}.weekdays button{flex:1;min-width:0;min-height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--muted)}.weekdays button[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}.field-control{position:relative}.field-control svg{position:absolute;right:12px;top:12px;width:20px;height:20px;color:var(--muted);pointer-events:none}.field-control input{padding-right:40px}.form-split{display:flex;gap:12px}.form-split>div{flex:1;min-width:0}.submit{width:100%;min-height:50px;background:var(--accent);border:0;border-radius:12px;color:white;font-weight:600;margin-top:24px}.form-footer{font-size:10px;color:var(--muted);text-align:center;margin-top:11px}[hidden]{display:none!important}select{appearance:none;padding-right:30px}.category-field{display:flex;align-items:center;position:relative}.category-field .dot{position:absolute;left:13px;width:7px;height:7px}.category-field select{padding-left:29px}@media(min-width:412px){.row{min-height:72px}.name{font-size:14px}.matrix-label{width:124px}.matrix-row{min-height:61px}}.native-field{position:relative}.native-field input{color:transparent}.native-display{position:absolute;left:13px;top:15px;font-size:13px;pointer-events:none}.native-field input::-webkit-datetime-edit{opacity:0}</style></head><body><header class="create-header"><div><h1>Crear</h1><p>Un pequeño paso, a tu ritmo.</p></div><a class="close" href="a-hoy.html" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></a></header><main class="form-main"><form><div class="segment" aria-label="Tipo de actividad"><button type="button" data-mode="task" aria-pressed="false">Tarea</button><button type="button" class="selected" data-mode="habit" aria-pressed="true">Hábito</button></div><label for="name">Nombre</label><input id="name" value="Ir al gimnasio" required placeholder="¿Qué quieres hacer?"><div id="habit-fields"><label for="frequency">Frecuencia</label><div class="field-control"><select id="frequency"><option>A diario</option><option selected>Días de la semana</option><option>Cada N días</option><option>Cada mes</option></select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></div><div class="weekdays" id="weekdays" aria-label="Días de la semana"><button type="button" aria-pressed="true" aria-label="Lunes">L</button><button type="button" aria-pressed="false" aria-label="Martes">M</button><button type="button" aria-pressed="true" aria-label="Miércoles">X</button><button type="button" aria-pressed="false" aria-label="Jueves">J</button><button type="button" aria-pressed="true" aria-label="Viernes">V</button><button type="button" aria-pressed="false" aria-label="Sábado">S</button><button type="button" aria-pressed="false" aria-label="Domingo">D</button></div><div id="interval-field" hidden><label for="interval">Intervalo de días</label><input id="interval" type="number" min="1" value="2"></div><div id="month-field" hidden><label for="month-day">Día del mes</label><input id="month-day" type="number" min="1" max="31" value="6"></div><label for="schedule">Cuándo</label><div class="form-split"><div class="field-control"><select id="schedule"><option>Por franja</option><option selected>A una hora</option></select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></div><div class="field-control" id="habit-time-field"><div class="native-field"><input id="habit-time" type="time" value="18:30" aria-label="Hora del hábito"><span class="native-display" id="habit-time-display">18:30</span></div></div><div id="period-field" class="field-control" hidden><select aria-label="Franja"><option>Mañana</option><option>Tarde</option><option>Noche</option></select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></div></div></div><div id="task-fields" hidden><label for="notes">Notas</label><textarea id="notes" placeholder="Añade algún detalle (opcional)"></textarea><div class="form-split"><div><label for="task-date">Fecha · opcional</label><input id="task-date" type="date"></div><div><label for="task-time">Hora · opcional</label><input id="task-time" type="time"></div></div><p class="helper">Sin fecha, va a la Bandeja de entrada.</p></div><label for="category">Categoría</label><div class="category-field" style="--category:var(--health)"><span class="dot" id="category-dot"></span><select id="category"><option>Sin categoría · Bandeja</option><option>Universidad</option><option selected>Salud</option><option>Personal</option><option>Casa</option></select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></div><div id="start-field"><label for="start">Fecha de inicio</label><div class="native-field"><input id="start" type="date" value="2026-10-06"><span class="native-display" id="start-display">6 de octubre de 2026</span></div><p class="helper">Se repetirá los lunes, miércoles y viernes.</p></div><button class="submit" type="submit">Crear hábito</button><p class="form-footer" role="status" id="form-message">Puedes cambiarlo cuando lo necesites.</p></form></main><script>const modeButtons = document.querySelectorAll('[data-mode]');
for (const modeButton of modeButtons) {
  modeButton.addEventListener('click', function() {
    const isHabit = modeButton.dataset.mode === 'habit';
    for (const button of modeButtons) {
      const isSelected = button === modeButton;
      button.classList.toggle('selected', isSelected);
      button.setAttribute('aria-pressed', String(isSelected));
    }
    document.getElementById('habit-fields').hidden = !isHabit;
    document.getElementById('start-field').hidden = !isHabit;
    document.getElementById('task-fields').hidden = isHabit;
    document.getElementById('category').value = isHabit ? 'Salud' : 'Sin categoría · Bandeja';
    updateCategory();
    document.querySelector('.submit').textContent = isHabit ? 'Crear hábito' : 'Crear tarea';
    document.getElementById('form-message').textContent = 'Puedes cambiarlo cuando lo necesites.';
  });
}
for (const weekdayButton of document.querySelectorAll('.weekdays button')) {
  weekdayButton.addEventListener('click', function() {
    const wasSelected = weekdayButton.getAttribute('aria-pressed') === 'true';
    weekdayButton.setAttribute('aria-pressed', String(!wasSelected));
    document.querySelector('#start-field .helper').textContent = 'Se repetirá los días que selecciones.';
  });
}
document.getElementById('frequency').addEventListener('change', function(event) {
  document.getElementById('weekdays').hidden = event.target.value !== 'Días de la semana';
  document.getElementById('interval-field').hidden = event.target.value !== 'Cada N días';
  document.getElementById('month-field').hidden = event.target.value !== 'Cada mes';
  document.querySelector('#start-field .helper').textContent = 'La repetición comienza en la fecha de inicio.';
});
document.getElementById('schedule').addEventListener('change', function(event) {
  const useTime = event.target.value === 'A una hora';
  document.getElementById('habit-time-field').hidden = !useTime;
  document.getElementById('period-field').hidden = useTime;
});
function updateCategory() {
  const colors = {'Salud':'#4F7A45','Universidad':'#3B5B7A','Personal':'#B7791F','Casa':'#9B3A4C','Sin categoría · Bandeja':'#75695A'};
  document.getElementById('category-dot').style.background = colors[document.getElementById('category').value];
}
document.getElementById('category').addEventListener('change', updateCategory);
document.querySelector('form').addEventListener('submit', function(event) {
  event.preventDefault();
  document.getElementById('form-message').textContent = 'Vista previa: no se guardan datos.';
});document.getElementById('habit-time').addEventListener('change', function(event) {
  document.getElementById('habit-time-display').textContent = event.target.value;
});
document.getElementById('start').addEventListener('change', function(event) {
  if (!event.target.value) {
    document.getElementById('start-display').textContent = '';
    return;
  }
  const selectedDate = new Date(event.target.value + 'T12:00:00');
  document.getElementById('start-display').textContent = selectedDate.toLocaleDateString('es-ES', {day:'numeric', month:'long', year:'numeric'});
});</script></body></html>
