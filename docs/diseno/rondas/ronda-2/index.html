<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ronda 2 · Estilos</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 32px; background: #141414; color: #eee; font: 15px/1.5 system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  h2 { margin: 40px 0 12px; font-size: 17px; }
  h2 span { color: #999; font-weight: 400; font-size: 14px; }
  p { margin: 0 0 8px; color: #aaa; max-width: 900px; }
  a { color: #fff; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; }
  figure { margin: 0; }
  figcaption { margin-bottom: 8px; color: #bbb; }
  .phone { width: 360px; height: 800px; border: 10px solid #2b2b2b; border-radius: 36px; overflow: hidden; background: #000; }
  iframe { width: 360px; height: 800px; border: 0; display: block; }
</style>
</head>
<body>
  <h1>Ronda 2 · Estilos</h1>
  <p>La estructura ya es la que elegiste en la ronda 1; cambia el estilo. A y B son tu blanco y tu negro; C, D y E, candidatos al tercer estilo. Cada uno, en tres pantallas: Hoy (pulsa ✓ o ✗), Historial y Crear (cambia entre Tarea y Hábito).</p>
  <div id="estilos"></div>
  <script>
    const styles = [
      ['a', 'A · Blanco', 'papel y tinta · lo hizo Codex'],
      ['b', 'B · Negro', 'bosque nocturno · lo hizo Codex'],
      ['c', 'C · Neobrutalismo pulido', 'tercer estilo · lo hizo Copilot'],
      ['d', 'D · Cobalto', 'tercer estilo · lo hizo Codex'],
      ['e', 'E · Mostaza', 'tercer estilo · lo hizo Codex'],
    ];
    const screens = [['hoy', 'Hoy'], ['historial', 'Historial'], ['crear', 'Crear']];
    const container = document.getElementById('estilos');
    for (const [letter, title, detail] of styles) {
      const heading = document.createElement('h2');
      heading.innerHTML = `${title} <span>· ${detail}</span>`;
      container.appendChild(heading);
      const row = document.createElement('div');
      row.className = 'row';
      for (const [screen, label] of screens) {
        const file = `${letter}-${screen}.html`;
        row.insertAdjacentHTML('beforeend', `<figure><figcaption><a href="${file}">${label}</a></figcaption><div class="phone"><iframe src="${file}" title="${title} · ${label}"></iframe></div></figure>`);
      }
      container.appendChild(row);
    }
  </script>
</body>
</html>
