<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crear · B Negro</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:14px 'DM Sans',sans-serif;min-height:100dvh}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}svg{width:22px;height:22px;flex-shrink:0}button{border:0;background:none}a{color:inherit;text-decoration:none}main{padding:28px 20px 180px;max-width:600px;margin:auto}.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}h1{font-size:30px;letter-spacing:-1.1px;line-height:1.15;margin:0 0 8px;font-weight:700}.subtitle{margin:0;color:var(--muted);font-size:12px}.count{font-size:15px;color:var(--accent);white-space:nowrap;padding-left:8px}.section-title{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;margin:20px 0 8px}.section-title:after{content:'';flex:1;height:1px;background:var(--border)}.row{display:flex;align-items:center;min-height:66px;gap:4px;padding:9px 10px 9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:6px}.row-info{flex:1;min-width:0}.row-title{font-weight:500;font-size:13px;line-height:18px;margin-bottom:6px}.meta{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}.dot{width:5px;height:5px;background:var(--category);border-radius:50%;display:inline-block}.mark{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.mark.positive svg{width:30px;height:30px;padding:6px;background:var(--category);border-radius:50%;color:var(--background)}.mark.negative{color:var(--negative)}.mark.negative svg{width:19px;height:19px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:78px;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;z-index:5;padding:9px 6px 8px}.nav-item{width:20%;display:flex;align-items:center;flex-direction:column;gap:5px;color:var(--muted);font-size:9px;padding:0}.nav-icon{display:flex;align-items:center;justify-content:center;position:relative;width:48px;height:32px;border-radius:18px}.active{color:var(--accent)}.active .nav-icon{background:var(--raised)}.badge{position:absolute;right:3px;top:-3px;background:var(--accent);color:var(--background);border:2px solid var(--surface);border-radius:20px;font-size:9px;font-weight:700;min-width:16px;line-height:13px}.fab{position:fixed;right:20px;bottom:150px;width:52px;height:52px;background:var(--accent);color:var(--background);display:flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:0 4px 16px #0004;z-index:4}.fab svg{width:25px;height:25px}.toast{position:fixed;left:20px;right:20px;bottom:90px;border-radius:12px;background:var(--raised);border:1px solid var(--border);height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;font-size:11px;z-index:4}.toast button{color:var(--accent);font-weight:700;min-height:44px;padding:0 0 0 8px}.segmented{display:flex;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;gap:4px}.segmented button{flex:1;min-height:40px;border-radius:8px;font-size:12px;color:var(--muted)}.segmented button[aria-pressed=true]{background:var(--raised);color:var(--accent);font-weight:600}.history-main{padding-bottom:100px}.history-caption{color:var(--muted);font-size:11px;display:flex;justify-content:space-between;margin:24px 0 16px}.matrix{width:100%;border-collapse:collapse;table-layout:fixed}.matrix th:first-child{width:105px}.matrix th{font-weight:400;font-size:9px;color:var(--muted);padding:8px 0}.matrix .day{display:block;font-size:13px;color:var(--text);margin-top:5px;font-weight:600}.matrix .today{background:var(--raised)}.matrix thead .today{border-radius:9px 9px 0 0}.matrix td{text-align:center;height:58px;border-top:1px solid var(--border);font-size:15px}.matrix td:first-child{text-align:left;padding-right:7px;font-size:11px;font-weight:500;line-height:15px}.matrix .row-category{display:block;font-size:9px;font-weight:400;color:var(--muted);margin-top:4px}.matrix .group td{height:30px;border:0;color:var(--muted);font-size:9px;letter-spacing:1.3px;text-transform:uppercase;padding-top:12px}.matrix .yes{color:var(--category);font-weight:700}.matrix .no{color:var(--negative)}.matrix .unmarked{color:var(--muted);font-size:13px}.matrix .progress td{height:48px;font-size:10px;color:var(--accent);border-top:1px solid var(--border)}.matrix .progress td:first-child{color:var(--muted);font-size:10px}.legend{display:flex;gap:16px;margin-top:20px;color:var(--muted);font-size:10px;align-items:center}.legend b{font-size:14px;margin-right:4px}.history-note{font-size:10px;color:var(--muted);line-height:16px;margin-top:12px}.create-main{padding:20px 20px 28px}.create-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.create-heading h1{font-size:25px;margin:0}.close{display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:var(--surface);border-radius:50%;color:var(--muted)}.create-main .segmented{margin-bottom:22px}.field{display:block;margin-bottom:17px}.field-label,fieldset legend{font-size:11px;color:var(--muted);display:block;margin-bottom:8px;font-weight:500}.control{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);height:46px;min-width:0;font-size:13px}textarea.control{height:76px;resize:vertical}.field-pair{display:flex;gap:12px}.field-pair>.field{flex:1;min-width:0}fieldset{border:0;margin:0 0 18px;padding:0}.weekdays{display:flex;gap:2px;margin-top:10px;justify-content:space-between}.weekdays button{width:44px;height:44px;border:1px solid var(--border);border-radius:50%;font-size:12px;color:var(--muted)}.weekdays button[aria-pressed=true]{color:var(--background);background:var(--accent);border-color:var(--accent);font-weight:700}.when-selector{display:flex;gap:8px;margin-bottom:9px}.when-selector button{height:44px;background:var(--surface);border:1px solid var(--border);border-radius:9px;flex:1;font-size:12px;color:var(--muted)}.when-selector button[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}.help{font-size:10px;color:var(--muted);margin:7px 0 0;line-height:15px}.submit{background:var(--accent);color:var(--background);height:50px;border-radius:11px;width:100%;font-weight:700;font-size:14px;margin-top:5px}.submit svg{width:17px;height:17px;vertical-align:middle;margin-right:6px}[hidden]{display:none!important}.range-note{font-size:11px;color:var(--accent);padding:8px 0}.notice{padding:12px;margin:12px 0;color:var(--accent);background:var(--raised);border-radius:10px;font-size:12px}@media(min-width:400px){.row{min-height:73px}.row-title{font-size:14px}.section-title{margin-top:24px}.matrix th:first-child{width:120px}.matrix td{height:65px}.create-main{padding-top:28px}.field{margin-bottom:22px}}.native-field{position:relative;display:flex;align-items:center;justify-content:space-between}.native-field svg{width:18px;height:18px;color:var(--muted)}.native-field input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.native-field:focus-within{outline:2px solid var(--accent);outline-offset:3px}</style></head><body><main class="create-main"><header class="create-heading"><h1>Crear</h1><a class="close" href="b-hoy.html" aria-label="Cerrar y volver a Hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></a></header><div class="segmented" aria-label="Tipo"><button type="button" data-mode="task" aria-pressed="false">Tarea</button><button type="button" data-mode="habit" aria-pressed="true">Hábito</button></div><form id="create-form"><label class="field"><span class="field-label">Nombre</span><input class="control" name="name" required value="Ir al gimnasio" autocomplete="off" placeholder="¿Qué quieres hacer?"></label><div id="habit-fields"><fieldset><legend>Frecuencia</legend><select class="control" id="frequency" aria-label="Frecuencia"><option value="daily">A diario</option><option value="weekly" selected>Días de la semana</option><option value="interval">Cada N días</option><option value="monthly">Cada mes</option></select><div class="weekdays" id="weekdays" aria-label="Días de la semana"><button type="button" aria-label="Lunes" aria-pressed="true">L</button><button type="button" aria-label="Martes" aria-pressed="false">M</button><button type="button" aria-label="Miércoles" aria-pressed="true">X</button><button type="button" aria-label="Jueves" aria-pressed="false">J</button><button type="button" aria-label="Viernes" aria-pressed="true">V</button><button type="button" aria-label="Sábado" aria-pressed="false">S</button><button type="button" aria-label="Domingo" aria-pressed="false">D</button></div><label id="interval-field" class="field" hidden style="margin-top:10px"><span class="field-label">Número de días</span><input class="control" type="number" min="1" value="2" aria-label="Cada cuántos días"></label><label id="month-field" class="field" hidden style="margin-top:10px"><span class="field-label">Día del mes</span><input class="control" type="number" min="1" max="31" value="6" aria-label="Día del mes"></label></fieldset><fieldset><legend>Cuándo</legend><div class="when-selector"><button type="button" data-when="period" aria-pressed="false">Franja del día</button><button type="button" data-when="time" aria-pressed="true">A una hora</button></div><div id="habit-time-field" class="native-field control"><span id="habit-time-text">18:30</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><input id="habit-time" type="time" value="18:30" aria-label="Hora del hábito"></div><select id="period" class="control" aria-label="Franja del día" hidden><option>Mañana</option><option selected>Tarde</option><option>Noche</option></select></fieldset></div><div id="task-fields" hidden><label class="field"><span class="field-label">Notas <span style="font-weight:400">· opcionales</span></span><textarea class="control" placeholder="Añade algún detalle" name="notes"></textarea></label><div class="field-pair"><label class="field"><span class="field-label">Fecha · opcional</span><input class="control" type="date" name="task-date" aria-label="Fecha opcional de la tarea"></label><label class="field"><span class="field-label">Hora · opcional</span><input class="control" type="time" name="task-time" aria-label="Hora opcional de la tarea"></label></div><p class="help" style="margin:-8px 0 18px">Sin fecha, irá a la Bandeja de entrada.</p></div><label class="field"><span class="field-label">Categoría</span><select class="control" id="category" name="category"><option value="inbox">Sin categoría · Bandeja</option><option value="university">Universidad</option><option value="health" selected>Salud</option><option value="personal">Personal</option><option value="house">Casa</option></select></label><label id="start-field" class="field"><span class="field-label">Fecha de inicio</span><span class="native-field control"><span id="start-date-text">6 oct. 2026</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg><input id="start-date" type="date" value="2026-10-06" aria-label="Fecha de inicio del hábito"></span><span class="help">Hoy, 6 de octubre de 2026</span></label><div id="form-notice" class="notice" hidden role="status"></div><button class="submit" type="submit">Crear</button></form></main><script>const modeButtons = document.querySelectorAll('[data-mode]');
const habitFields = document.querySelector('#habit-fields');
const taskFields = document.querySelector('#task-fields');
const startField = document.querySelector('#start-field');
const category = document.querySelector('#category');
const nameInput = document.querySelector('[name=name]');
const formNotice = document.querySelector('#form-notice');
let currentMode = 'habit';
const draftNames = { habit: 'Ir al gimnasio', task: '' };
const draftCategories = { habit: 'health', task: 'inbox' };
modeButtons.forEach(function(button) {
  button.addEventListener('click', function() {
    draftNames[currentMode] = nameInput.value;
    draftCategories[currentMode] = category.value;
    currentMode = button.dataset.mode;
    modeButtons.forEach(function(modeButton) {
      modeButton.setAttribute('aria-pressed', String(modeButton === button));
    });
    habitFields.hidden = currentMode !== 'habit';
    taskFields.hidden = currentMode !== 'task';
    startField.hidden = currentMode !== 'habit';
    nameInput.value = draftNames[currentMode];
    category.value = draftCategories[currentMode];
    formNotice.hidden = true;
  });
});
document.querySelectorAll('.weekdays button').forEach(function(button) {
  button.addEventListener('click', function() {
    const wasSelected = button.getAttribute('aria-pressed') === 'true';
    button.setAttribute('aria-pressed', String(!wasSelected));
  });
});
document.querySelector('#frequency').addEventListener('change', function(event) {
  const frequency = event.target.value;
  document.querySelector('#weekdays').hidden = frequency !== 'weekly';
  document.querySelector('#interval-field').hidden = frequency !== 'interval';
  document.querySelector('#month-field').hidden = frequency !== 'monthly';
});
const whenButtons = document.querySelectorAll('[data-when]');
whenButtons.forEach(function(button) {
  button.addEventListener('click', function() {
    whenButtons.forEach(function(whenButton) {
      whenButton.setAttribute('aria-pressed', String(whenButton === button));
    });
    document.querySelector('#habit-time-field').hidden = button.dataset.when !== 'time';
    document.querySelector('#period').hidden = button.dataset.when !== 'period';
  });
});
document.querySelector('#create-form').addEventListener('submit', function(event) {
  event.preventDefault();
  formNotice.hidden = false;
  if (currentMode === 'habit' && document.querySelector('#frequency').value === 'weekly') {
    const selectedDays = document.querySelectorAll('.weekdays button[aria-pressed=true]');
    if (selectedDays.length === 0) {
      formNotice.textContent = 'Elige al menos un día de la semana.';
      return;
    }
  }
  formNotice.textContent = 'Listo. Este prototipo no guarda los cambios.';
});document.querySelector('#habit-time').addEventListener('change', function(event) {
  document.querySelector('#habit-time-text').textContent = event.target.value || 'Elegir hora';
});
document.querySelector('#start-date').addEventListener('change', function(event) {
  const dateValue = event.target.value;
  if (!dateValue) {
    document.querySelector('#start-date-text').textContent = 'Elegir fecha';
    return;
  }
  const date = new Date(dateValue + 'T12:00:00');
  document.querySelector('#start-date-text').textContent = date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
});</script></body></html>
