name: Copia cifrada

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno que se copiará (producción requiere main)
        type: choice
        options: [produccion, pruebas]
        default: produccion
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      retention_days:
        type: number
        default: 90

permissions:
  contents: read

jobs:
  backup:
    if: (inputs.environment || 'produccion') == 'pruebas' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment || 'produccion' }}
    concurrency:
      group: deploy-${{ inputs.environment || 'produccion' }}-database
      cancel-in-progress: false
    env:
      EXPO_NO_TELEMETRY: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Construir entorno Docker
        run: ./docker/app/run build
      - name: Instalar lockfile
        run: ./docker/app/run npm ci
      - name: Comprobar cifrado y fallos del script
        run: ./docker/app/run sh scripts/backup/create.test.sh
      - name: Exportar y cifrar
        run: |
          mkdir -p .backup
          export APP_UID=$(id -u) APP_GID=$(id -g)
          export DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
          docker compose run --rm -e SUPABASE_PROJECT_REF -e SUPABASE_ACCESS_TOKEN -e SUPABASE_DB_PASSWORD -e BACKUP_PASSPHRASE app sh scripts/backup/create.sh .backup/database.tar.gz.gpg
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: backup-${{ inputs.environment || 'produccion' }}-${{ github.run_id }}
          path: .backup/database.tar.gz.gpg
          retention-days: ${{ inputs.retention_days || 90 }}
          if-no-files-found: error
