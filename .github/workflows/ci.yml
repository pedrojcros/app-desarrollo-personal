name: CI

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.agents/**'
      - '.claude/**'
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      quality: ${{ steps.files.outputs.quality }}
    steps:
      - name: Detectar cambios que requieren CI
        id: files
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const ignoredPaths = [
              (path) => path.startsWith('docs/'),
              (path) => path.endsWith('.md'),
              (path) => path.startsWith('.agents/'),
              (path) => path.startsWith('.claude/'),
            ];
            const requiresQuality = files.some((file) => {
              return !ignoredPaths.some((isIgnored) => isIgnored(file.filename));
            });
            core.setOutput('quality', String(requiresQuality));

  quality:
    needs: changes
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.quality == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_NO_TELEMETRY: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Construir entorno Docker
        run: ./docker/app/run build
      - name: Restaurar caché de npm
        uses: actions/cache@v4.2.3
        with:
          path: .npm
          key: linux-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: linux-npm-
      - name: Instalar dependencias fijadas
        run: ./docker/app/run sh -c 'npm_config_cache="$PWD/.npm" npm ci --prefer-offline'
      - name: Preparar variables locales
        run: cp .env.example .env
      - name: Lint y formato
        run: ./docker/app/run npm run lint
      - name: Tipos
        run: ./docker/app/run npm run typecheck
      - name: Tests de componentes
        run: ./docker/app/run npm run test
      - name: Tests del dominio en varias zonas horarias
        run: ./docker/app/run npm run test:zones
      - name: Arrancar Supabase local
        run: ./docker/app/run npx supabase start > /tmp/supabase-start.log 2>&1
      - name: Integración con Supabase real
        run: ./docker/app/run npm run test:integration
      - name: Exportar web
        run: ./docker/app/run npm run export:web
      - name: Detener Supabase local
        if: always()
        run: ./docker/app/run npx supabase stop

  secrets:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: >-
          docker run --rm
          -v "$PWD:/repository:ro"
          zricethezav/gitleaks:v8.24.3
          git /repository --config /repository/.gitleaks.toml --redact
